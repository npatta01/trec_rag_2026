# Two-stage answer generation. Stage 1 uses a lower-cost model to prioritize and
# deduplicate evidence-backed claims; Stage 2 uses GPT-5.6 Sol to write the final
# organizer-format answer from that locally validated plan and the same sealed evidence.
schema_version: competition_rag_config_v2

experiment:
  id: rag26_competition_rag_priority_aware_v3
  output_dir: outputs/rag26_competition_rag_priority_aware_v3
  mode: create

submission:
  team_id: castorini
  run_desc: Selected-evidence retrieval with priority-aware planning and GPT-5.6 Sol generation.

inputs:
  handoff_manifest: outputs/facet-deepseek-b40-v3/generation_handoff_manifest.json

generation:
  type: openrouter
  api_base: https://openrouter.ai/api/v1
  api_key_env: OPENROUTER_API_KEY
  model: openai/gpt-5.6-sol
  reasoning_effort: medium
  strategy: priority_aware
  structured_output: strict_schema
  temperature: null
  max_tokens: 12000
  timeout_seconds: 900
  transport_max_attempts: 3
  concurrency: 4
  priority_aware:
    planner_model: deepseek/deepseek-v4-flash
    planner_reasoning_effort: minimal
    planner_structured_output: json_object
    planner_temperature: 0
    planner_max_tokens: 24000
    min_claims_per_group: 1
    max_claims_per_group: 5
    max_claims: 42
    target_min_words: 750
    target_max_words: 950
