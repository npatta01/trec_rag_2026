experiment:
  id: rag25_reranker_1k_gte_modernbert_v1

submission:
  team_id: local-baseline

topics:
  path: trec-rag-data/trec-rag-2026/development-data/topics/rag25-topics-dev.tsv
  format: tsv

query_understanding:
  variants:
    - name: original
      type: original_topic

retrievers:
  - name: climbmix_bm25
    type: pyserini_remote
    query_variants: [original]
    hits: 1000
    index: climbmix-400b
    corpus_epoch: climbmix-400b-operator-archive-facet-2025-v2-sha256-2ccad901eb908ac14747bafd2069f7c8aa96ecaaa8cc30457ff47c73ce3bf81f
    cache: true

ranking:
  type: coverage_aware_long_doc_aggregate
  dedupe:
    by: docid
    keep: best_rank
    preserve_provenance: true
  reranker:
    model: Alibaba-NLP/gte-reranker-modernbert-base
    model_revision: f7481e6055501a30fb19d090657df9ec1f79ab2c
    backend_version: 5.6.0
    score_representation: raw_logits
    inference_dtype: bfloat16
    input_policy: trec_rag_raw_v2
    artifact_schema_version: 2
    # Required by artifact schema v2, but this comparison materializes only
    # 1,024-token window scores; no GTE full-document score is generated.
    document_max_length: 32768
    document_pair_buffer_tokens: 512
    window_max_length: 1024
    chunk_max_characters: 3500
    chunk_overlap_characters: 350
    score_source: cached_artifacts
    candidate_depth: 1000
    document_score_path: cache/reranker/artifacts/rag25_reranker_1k_comparison_v1/gte_modernbert_document_scores.jsonl
    window_score_path: cache/reranker/artifacts/rag25_reranker_1k_comparison_v1/gte_modernbert_window_scores.jsonl
    formula:
      long_document_weight: 0.5
      strongest_passage_weight: 0.5
      coverage_bonus_weight: 0.25
      relative_span_delta: 1.0
      support_cap: 6
      min_new_chars: 800
      top_window_weights: [0.55, 0.25, 0.13, 0.07]

evidence:
  type: top_k
  k: 5
  require_text: true
  allow_fewer: true

generation:
  type: placeholder

evaluation:
  kind: dev_projected_qrels
  qrels: trec-rag-data/trec-rag-2026/development-data/rag25-dev-umbrela-qrels/rag25-climbmix-umbrela-codex-gpt5.5-medium-reasoning-v1.qrels
  metrics: [ndcg@10, ndcg@20, judged_count@10, judged_rate@10, judged_count@20, judged_rate@20]
  relevance_threshold: 2
