experiment:
  id: rag25_bm25_litellm_facets_rrf_v1

submission:
  team_id: local-baseline

topics:
  path: trec-rag-data/trec-rag-2026/development-data/topics/rag25-topics-dev.tsv
  format: tsv

query_understanding:
  variants:
    - name: title
      type: title
    - name: facets
      type: llm_facets
      provider: litellm
      max_facets: 8
      cache: true

retrievers:
  - name: climbmix_bm25
    type: pyserini_remote
    query_variants: [title, facets]
    hits: 100
    index: climbmix-400b
    cache: true
    request_delay_seconds: 3

ranking:
  type: rrf
  rrf_k: 60
  dedupe:
    by: docid
    keep: best_rank
    preserve_provenance: true

evidence:
  type: top_k
  k: 5
  require_text: true
  allow_fewer: true

generation:
  type: placeholder

evaluation:
  kind: dev_projected_qrels
  qrels: trec-rag-data/trec-rag-2026/development-data/rag25-dev-umbrela-qrels/rag25-climbmix-umbrela-codex-gpt5.5-medium-reasoning-v1.qrels
  metrics: [ndcg@10, recall@100]
  relevance_threshold: 2
