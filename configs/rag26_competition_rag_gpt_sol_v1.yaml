schema_version: competition_rag_config_v1

experiment:
  id: rag26_competition_rag_gpt_sol_v1
  output_dir: outputs/rag26_competition_rag_gpt_sol_v1
  mode: create

submission:
  team_id: castorini
  run_desc: Fixed retrieval with GPT-5.6 Sol medium answer generation.

inputs:
  queries: trec-rag-data/trec-rag-2026/test-data/trec_rag_2026_queries.tsv
  run: outputs/facet-deepseek-b40-v1/r_output_trec_rag_2026.tsv
  documents: outputs/facet-deepseek-b40-v1/retrieval_with_text.jsonl.zip
  archive_member: null

retrieval:
  top_k: 100
  max_document_words: 1000

generation:
  type: openrouter
  api_base: https://openrouter.ai/api/v1
  api_key_env: OPENROUTER_API_KEY
  model: openai/gpt-5.6-sol
  reasoning_effort: medium
  # Measured on four development topics against the released gold nuggets. Against the
  # default prompt: strict_vital 0.588 -> 0.630, strict_all 0.569 -> 0.609, weighted citation
  # precision 0.692 -> 0.747, hard precision 0.481 -> 0.586. The tail profile restates the
  # output contract after the question, because with 100 documents inserted the leading
  # contract sits roughly 120k tokens above the generation point.
  prompt_profile: focused_citations_tail
  temperature: null
  max_tokens: 6000
  timeout_seconds: 900
  transport_max_attempts: 3
  concurrency: 4
