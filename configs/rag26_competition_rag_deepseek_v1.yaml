# Second-run configuration, contrasting with the GPT-5.6 Sol run.
#
# Measured on four development topics: this generator trails Sol on nugget coverage
# (0.497 against 0.588 on the focused prompt) but leads on citation support
# (hard precision 0.678 against 0.481), so the two runs have different strengths.
# It costs $0.0135 per topic against Sol's $0.7115, which also makes it the vehicle for
# screening prompt changes before confirming them on Sol.
#
# reasoning_effort must be a native DeepSeek level. OpenRouter's "medium" is not one, and
# under it roughly half the token budget went to reasoning, truncating answers to 397-676
# words. structured_output must stay strict_schema: relaxing it to json_object failed three
# of four topics with malformed shapes.
schema_version: competition_rag_config_v1

experiment:
  id: rag26_competition_rag_deepseek_v1
  output_dir: outputs/rag26_competition_rag_deepseek_v1
  mode: create

submission:
  team_id: castorini
  run_desc: Fixed retrieval with DeepSeek V4 Flash 0731 answer generation.

inputs:
  queries: trec-rag-data/trec-rag-2026/test-data/trec_rag_2026_queries.tsv
  run: outputs/facet-deepseek-b40-v1/r_output_trec_rag_2026.tsv
  documents: outputs/facet-deepseek-b40-v1/retrieval_with_text.jsonl.zip
  archive_member: null

retrieval:
  top_k: 100
  max_document_words: 1000

generation:
  type: openrouter
  api_base: https://openrouter.ai/api/v1
  api_key_env: OPENROUTER_API_KEY
  model: deepseek/deepseek-v4-flash-0731
  reasoning_effort: high
  # The tail profile restates the output contract after the question, because with 100
  # documents inserted the leading contract sits roughly 120k tokens above the generation
  # point. Measured for THIS generator on three development topics: strict_vital 0.529 ->
  # 0.578. The corresponding Sol figures are recorded in the Sol config, not here.
  prompt_profile: focused_citations_tail
  temperature: null
  max_tokens: 32000
  timeout_seconds: 900
  transport_max_attempts: 3
  concurrency: 4
