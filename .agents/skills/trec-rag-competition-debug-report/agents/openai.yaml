interface:
  display_name: "Competition Debug Report"
  short_description: "Explain a completed TREC RAG run, and evaluate it when explicitly invoked"
  default_prompt: "Use $trec-rag-competition-debug-report to build the private evaluation bundle and friendly report for this completed competition run with trec_rag.competition_evaluation_report, reusing cached RAGDoll judgments."
policy:
  # Explicit invocation is the authorization boundary for hosted RAGDoll
  # evaluation, which sends private statement and citation text off the host.
  # Harnesses that honor this key must not auto-match the skill; harnesses that
  # ignore it still get the same boundary from SKILL.md.
  allow_implicit_invocation: false
