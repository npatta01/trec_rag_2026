<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="ms-title ms-desc">
  <title id="ms-title">Seven handoffs between three actors, in one pass</title>
  <desc id="ms-desc">Three horizontal lanes: Luna at the top, Sol in the middle, local code at the bottom. The same sealed evidence enters all three. Seven numbered steps zigzag between the lanes in order: Luna plans the narrative blueprint, Sol writes the structured draft, Luna audits each authenticated evidence group, local code merges the audits, Sol proposes a bounded splice revision, Luna screens each proposed operation against support, atomicity, materiality, redundancy and replacement safety, and local code applies only the operations that passed all five. The path runs left to right once and never loops back. If revision work is malformed, ambiguous or rejected, the already validated draft stands. The accepted run made 894 Luna calls and 264 Sol calls, 1,158 provider calls in all.</desc>
  <style>
    :root{color-scheme:light dark;--bg:#f6f8f7;--panel:#fff;--ink:#13231c;--muted:#4b5d54;--line:#5e6d66;--hair:#cdd8d1;--ret:#087c72;--ret-soft:#d9f1ed;--gen:#5664c7;--gen-soft:#e6e9ff;--ok:#277a45;--ok-soft:#ddf2e3;--adv:#91610d;--adv-soft:#faecc7;--stop:#b3261e;--stop-soft:#fbe4e2}
    @media (prefers-color-scheme: dark){:root{--bg:#0d1411;--panel:#17211c;--ink:#f0f6f2;--muted:#bac7bf;--line:#9cada3;--hair:#2f3b35;--ret:#69d8ca;--ret-soft:#183d38;--gen:#aab4ff;--gen-soft:#242b57;--ok:#82dda0;--ok-soft:#173c25;--adv:#f0c46f;--adv-soft:#433616;--stop:#f2b8b5;--stop-soft:#42211f}}
    text{fill:var(--ink);font-family:Inter,ui-sans-serif,system-ui,sans-serif}
    .h{font-size:25px;font-weight:700}
    .u{font-size:20px;font-weight:700}
    .lab{font-size:18px;font-weight:650}
    .s{font-size:16px;fill:var(--muted)}
    .tiny{font-size:14px;fill:var(--muted)}
    .mono{font-size:15px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;fill:var(--ink)}
    .panel{fill:var(--panel);stroke:var(--hair);stroke-width:2}
    .ret{fill:var(--ret-soft);stroke:var(--ret);stroke-width:2.5}
    .gen{fill:var(--gen-soft);stroke:var(--gen);stroke-width:2.5}
    .ok{fill:var(--ok-soft);stroke:var(--ok);stroke-width:2.5}
    .adv{fill:var(--adv-soft);stroke:var(--adv);stroke-width:2.5}
    .flow{fill:none;stroke:var(--line);stroke-width:2.5;marker-end:url(#a)}
    .retflow{stroke:var(--ret)}
    .genflow{stroke:var(--gen)}
    .advflow{stroke:var(--adv);stroke-dasharray:7 5}
    .barred{fill:none;stroke:var(--stop);stroke-width:2.5;stroke-dasharray:7 5}
    .stopbar{stroke:var(--stop);stroke-width:5;stroke-linecap:round}
    .sep{stroke:var(--hair);stroke-width:2}
    .bound{stroke:var(--ret);stroke-width:3;stroke-dasharray:10 6}
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs>

  <rect width="1000" height="560" fill="var(--bg)"/>
  <text class="h" x="40" y="46">The work changes hands seven times, in one pass</text>
  <text class="s" x="40" y="76">Local code owns every boundary; neither model can widen its own budget.</text>
  <line class="sep" x1="190" y1="150" x2="960" y2="150" vector-effect="non-scaling-stroke"/>
  <text class="lab" x="170" y="156" text-anchor="end" fill="var(--adv)">Luna</text>
  <line class="sep" x1="190" y1="250" x2="960" y2="250" vector-effect="non-scaling-stroke"/>
  <text class="lab" x="170" y="256" text-anchor="end" fill="var(--gen)">Sol</text>
  <line class="sep" x1="190" y1="350" x2="960" y2="350" vector-effect="non-scaling-stroke"/>
  <text class="lab" x="170" y="356" text-anchor="end" fill="var(--ret)">local code</text>
  <rect class="adv" x="184" y="128" width="92" height="44" rx="8" vector-effect="non-scaling-stroke"/>
  <text class="lab" x="230" y="156" text-anchor="middle">plans</text>
  <circle cx="184" cy="128" r="11" fill="var(--panel)" stroke="var(--hair)" stroke-width="2" vector-effect="non-scaling-stroke"/>
  <text class="tiny" x="184" y="133" text-anchor="middle">1</text>
  <path class="flow" d="M276 150C316 150 244 250 282 250" vector-effect="non-scaling-stroke"/>
  <rect class="gen" x="284" y="228" width="92" height="44" rx="8" vector-effect="non-scaling-stroke"/>
  <text class="lab" x="330" y="256" text-anchor="middle">drafts</text>
  <circle cx="284" cy="228" r="11" fill="var(--panel)" stroke="var(--hair)" stroke-width="2" vector-effect="non-scaling-stroke"/>
  <text class="tiny" x="284" y="233" text-anchor="middle">2</text>
  <path class="flow" d="M376 250C416 250 344 150 382 150" vector-effect="non-scaling-stroke"/>
  <rect class="adv" x="384" y="128" width="92" height="44" rx="8" vector-effect="non-scaling-stroke"/>
  <text class="lab" x="430" y="156" text-anchor="middle">audits</text>
  <circle cx="384" cy="128" r="11" fill="var(--panel)" stroke="var(--hair)" stroke-width="2" vector-effect="non-scaling-stroke"/>
  <text class="tiny" x="384" y="133" text-anchor="middle">3</text>
  <path class="flow" d="M476 150C516 150 444 350 482 350" vector-effect="non-scaling-stroke"/>
  <rect class="ret" x="484" y="328" width="92" height="44" rx="8" vector-effect="non-scaling-stroke"/>
  <text class="lab" x="530" y="356" text-anchor="middle">merges</text>
  <circle cx="484" cy="328" r="11" fill="var(--panel)" stroke="var(--hair)" stroke-width="2" vector-effect="non-scaling-stroke"/>
  <text class="tiny" x="484" y="333" text-anchor="middle">4</text>
  <path class="flow" d="M576 350C616 350 544 250 582 250" vector-effect="non-scaling-stroke"/>
  <rect class="gen" x="584" y="228" width="92" height="44" rx="8" vector-effect="non-scaling-stroke"/>
  <text class="lab" x="630" y="256" text-anchor="middle">proposes</text>
  <circle cx="584" cy="228" r="11" fill="var(--panel)" stroke="var(--hair)" stroke-width="2" vector-effect="non-scaling-stroke"/>
  <text class="tiny" x="584" y="233" text-anchor="middle">5</text>
  <path class="flow" d="M676 250C716 250 644 150 682 150" vector-effect="non-scaling-stroke"/>
  <rect class="adv" x="684" y="128" width="92" height="44" rx="8" vector-effect="non-scaling-stroke"/>
  <text class="lab" x="730" y="156" text-anchor="middle">screens</text>
  <circle cx="684" cy="128" r="11" fill="var(--panel)" stroke="var(--hair)" stroke-width="2" vector-effect="non-scaling-stroke"/>
  <text class="tiny" x="684" y="133" text-anchor="middle">6</text>
  <path class="flow" d="M776 150C816 150 764 350 802 350" vector-effect="non-scaling-stroke"/>
  <rect class="ret" x="804" y="328" width="92" height="44" rx="8" vector-effect="non-scaling-stroke"/>
  <text class="lab" x="850" y="356" text-anchor="middle">applies</text>
  <circle cx="804" cy="328" r="11" fill="var(--panel)" stroke="var(--hair)" stroke-width="2" vector-effect="non-scaling-stroke"/>
  <text class="tiny" x="804" y="333" text-anchor="middle">7</text>
  <text class="tiny" x="190" y="110">the same sealed evidence reaches all three lanes</text>
  <rect class="panel" x="230" y="404" width="350" height="92" rx="10" vector-effect="non-scaling-stroke"/>
  <text class="s" x="248" y="432">What bounds each hand</text>
  <text class="tiny" x="248" y="456">≤ 6 audit cards per group · ≤ 3 proposed edits</text>
  <text class="tiny" x="248" y="478">all five screens must pass · two Sol reservations</text>
  <rect class="ok" x="610" y="404" width="350" height="92" rx="10" vector-effect="non-scaling-stroke"/>
  <text class="s" x="628" y="432">If any of it fails</text>
  <text class="tiny" x="628" y="456">the already validated draft stands</text>
  <text class="tiny" x="628" y="478">894 Luna + 264 Sol = 1,158 provider calls</text>
</svg>
