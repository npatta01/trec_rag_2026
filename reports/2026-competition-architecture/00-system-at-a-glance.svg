<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1370 530" role="img" aria-labelledby="glance-title glance-desc">
  <title id="glance-title">One frozen source, five accepted files</title>
  <desc id="glance-desc">An official narrative produces one authenticated frozen source, facet-deepseek-b40-v3. That source branches into three Retrieval TSVs at depth 1 to 121 and two RAG JSONLs of 119 reports each. All five files were accepted by Evalbase.</desc>
  <style>
    :root{color-scheme:light dark;--bg:#f6f8f7;--panel:#fff;--ink:#13231c;--muted:#4b5d54;--line:#5e6d66;--ret:#087c72;--ret-soft:#d9f1ed;--gen:#5664c7;--gen-soft:#e6e9ff;--ok:#277a45;--ok-soft:#ddf2e3;--adv:#91610d;--adv-soft:#faecc7}
    @media (prefers-color-scheme: dark){:root{--bg:#0d1411;--panel:#17211c;--ink:#f0f6f2;--muted:#bac7bf;--line:#9cada3;--ret:#69d8ca;--ret-soft:#183d38;--gen:#aab4ff;--gen-soft:#242b57;--ok:#82dda0;--ok-soft:#173c25;--adv:#f0c46f;--adv-soft:#433616}}
    text{fill:var(--ink);font-family:Inter,ui-sans-serif,system-ui,sans-serif}.label{font-size:36px;font-weight:700}.body{font-size:30px}.small{font-size:28px}.muted{fill:var(--muted)}.stage{fill:var(--panel);stroke:var(--line);stroke-width:2}.source{fill:var(--adv-soft);stroke:var(--adv);stroke-width:3}.retrieval{fill:var(--ret-soft);stroke:var(--ret);stroke-width:3}.generation{fill:var(--gen-soft);stroke:var(--gen);stroke-width:3}.accepted{fill:var(--ok-soft);stroke:var(--ok);stroke-width:3}.flow{fill:none;stroke:var(--line);stroke-width:3;marker-end:url(#arrow)}.ret-flow{stroke:var(--ret)}.gen-flow{stroke:var(--gen)}
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs>
  <rect width="1370" height="530" fill="var(--bg)"/>

  <rect class="stage" x="20" y="145" width="400" height="150" rx="10"/>
  <text class="label" x="220" y="212" text-anchor="middle">Official narrative</text>
  <text class="small muted" x="220" y="254" text-anchor="middle">one of 119</text>

  <path class="flow" d="M420 220H462" vector-effect="non-scaling-stroke"/>

  <rect class="source" x="475" y="135" width="420" height="170" rx="10"/>
  <text class="label" x="685" y="207" text-anchor="middle">One frozen source</text>
  <text class="body" x="685" y="252" text-anchor="middle">facet-deepseek-b40-v3</text>

  <path class="flow ret-flow" d="M895 220H925V115H952" vector-effect="non-scaling-stroke"/>
  <path class="flow gen-flow" d="M895 220H925V325H952" vector-effect="non-scaling-stroke"/>

  <rect class="retrieval" x="955" y="45" width="325" height="140" rx="10"/>
  <text class="label" x="1117" y="107" text-anchor="middle">3 Retrieval TSVs</text>
  <text class="small muted" x="1117" y="149" text-anchor="middle">depth 1–121</text>

  <rect class="generation" x="955" y="255" width="325" height="140" rx="10"/>
  <text class="label" x="1117" y="317" text-anchor="middle">2 RAG JSONLs</text>
  <text class="small muted" x="1117" y="359" text-anchor="middle">119 reports each</text>

  <path class="flow ret-flow" d="M1280 115H1312V412" vector-effect="non-scaling-stroke"/>
  <path class="flow gen-flow" d="M1280 325H1337V412" vector-effect="non-scaling-stroke"/>

  <rect class="accepted" x="250" y="420" width="1100" height="90" rx="45"/>
  <text class="label" x="800" y="477" text-anchor="middle">✓ Five files accepted by Evalbase</text>
</svg>
