<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" role="img" aria-labelledby="retrieval-title retrieval-desc">
  <title id="retrieval-title">Retrieval widens into bounded query lanes and narrows into selected evidence</title>
  <desc id="retrieval-desc">The untouched narrative and zero to eight DeepSeek-planned subnarratives each use the same Pyserini, chunking, Mixedbread, and top-passage search boundary. Local selection produces factual evidence, while Nuggetizer adds advisory hints before the authenticated handoff and separate retrieval exports.</desc>
  <style>
    :root{color-scheme:light dark;--bg:#f6f8f7;--panel:#fff;--ink:#13231c;--muted:#4b5d54;--line:#5e6d66;--ret:#087c72;--ret-soft:#d9f1ed;--adv:#91610d;--adv-soft:#faecc7}
    @media (prefers-color-scheme: dark){:root{--bg:#0d1411;--panel:#17211c;--ink:#f0f6f2;--muted:#bac7bf;--line:#9cada3;--ret:#69d8ca;--ret-soft:#183d38;--adv:#f0c46f;--adv-soft:#433616}}
    text{fill:var(--ink);font-family:Inter,ui-sans-serif,system-ui,sans-serif}.title{font-size:34px;font-weight:700}.label{font-size:29px;font-weight:700}.body{font-size:26px}.muted{fill:var(--muted)}.stage{fill:var(--panel);stroke:var(--line);stroke-width:2}.retrieval{fill:var(--ret-soft);stroke:var(--ret);stroke-width:3}.advisory-box{fill:var(--adv-soft);stroke:var(--adv);stroke-width:3}.flow{fill:none;stroke:var(--ret);stroke-width:3;marker-end:url(#arrow)}.join{fill:none;stroke:var(--ret);stroke-width:3}.advisory{stroke:var(--adv);stroke-dasharray:12 8}.store{fill:var(--panel);stroke:var(--line);stroke-width:2}
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs>
  <rect width="800" height="1200" fill="var(--bg)"/>
  <text class="title" x="400" y="55" text-anchor="middle">Retrieval: widen, score, then narrow</text>

  <rect class="stage" x="130" y="92" width="540" height="90" rx="8"/>
  <text class="label" x="400" y="148" text-anchor="middle">Official narrative</text>
  <path class="flow" d="M400 182V235" vector-effect="non-scaling-stroke"/>

  <rect class="retrieval" x="70" y="245" width="300" height="120" rx="8"/>
  <text class="label" x="220" y="293" text-anchor="middle">Original lane</text>
  <text class="body" x="220" y="332" text-anchor="middle">always retained</text>
  <rect class="retrieval" x="430" y="245" width="300" height="120" rx="8"/>
  <text class="label" x="580" y="293" text-anchor="middle">Planned lanes</text>
  <text class="body" x="580" y="332" text-anchor="middle">0–8 focused queries</text>
  <path class="flow" d="M400 182V210H220V245" vector-effect="non-scaling-stroke"/>
  <path class="flow" d="M400 182V210H580V245" vector-effect="non-scaling-stroke"/>

  <path class="join" d="M220 365V410H400M580 365V410H400" vector-effect="non-scaling-stroke"/>
  <path class="flow" d="M400 410V430" vector-effect="non-scaling-stroke"/>
  <rect class="retrieval" x="85" y="430" width="630" height="260" rx="8"/>
  <text class="label" x="400" y="474" text-anchor="middle">Same search boundary for every lane</text>
  <ellipse class="store" cx="400" cy="530" rx="230" ry="32"/>
  <rect class="store" x="170" y="530" width="460" height="58"/>
  <path d="M170 588A230 32 0 0 0 630 588" fill="var(--panel)" stroke="var(--line)" stroke-width="2"/>
  <text class="body" x="400" y="568" text-anchor="middle">ClimbMix document index</text>
  <text class="body" x="400" y="630" text-anchor="middle">Pyserini → ≤1,000 documents</text>
  <text class="body" x="400" y="670" text-anchor="middle">chunk → Mixedbread → ≤100 passages</text>

  <path class="flow" d="M400 690V745" vector-effect="non-scaling-stroke"/>
  <rect class="retrieval" x="105" y="755" width="590" height="115" rx="8"/>
  <text class="label" x="400" y="801" text-anchor="middle">Local evidence selection</text>
  <text class="body" x="400" y="839" text-anchor="middle">exact spans • deduplication • diversity</text>

  <path class="flow" d="M280 870V936" vector-effect="non-scaling-stroke"/>
  <rect class="retrieval" x="60" y="946" width="430" height="115" rx="8"/>
  <text class="label" x="275" y="991" text-anchor="middle">Selected passages</text>
  <text class="body" x="275" y="1031" text-anchor="middle">factual authority</text>

  <path class="flow advisory" d="M520 870V907H640V946" vector-effect="non-scaling-stroke"/>
  <rect class="advisory-box" x="525" y="946" width="215" height="115" rx="8"/>
  <text class="label" x="632" y="991" text-anchor="middle">Nuggetizer</text>
  <text class="body" x="632" y="1031" text-anchor="middle">advisory hints</text>

  <path class="flow" d="M275 1061V1135H400" vector-effect="non-scaling-stroke"/>
  <path class="flow advisory" d="M632 1061V1135H400" vector-effect="non-scaling-stroke"/>
  <rect class="stage" x="175" y="1125" width="450" height="62" rx="8"/>
  <text class="label" x="400" y="1167" text-anchor="middle">Sealed handoff + Retrieval exports</text>
</svg>
