<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" role="img" aria-labelledby="validation-title validation-desc">
  <title id="validation-title">Transport retries and semantic retries are separate clocks</title>
  <desc id="validation-desc">Within each hosted generation request, transport handling allows at most three attempts. Around the generation and local validation cycle, a topic allows at most two semantic attempts. Local gates check strict schema, a 1024-word ceiling, one to three unique allowed citations per answer object, and exact-hint citation compatibility. Accepted raw document IDs are then converted deterministically to organizer citation indexes.</desc>
  <style>
    :root{color-scheme:light dark;--bg:#f6f8f7;--panel:#fff;--ink:#13231c;--muted:#4b5d54;--line:#5e6d66;--gen:#5664c7;--gen-soft:#e6e9ff;--adv:#91610d;--adv-soft:#faecc7;--danger:#b4493e;--danger-soft:#f9dedb;--ok:#267047;--ok-soft:#dff0e6}
    @media (prefers-color-scheme: dark){:root{--bg:#0d1411;--panel:#17211c;--ink:#f0f6f2;--muted:#bac7bf;--line:#9cada3;--gen:#aab4ff;--gen-soft:#242b57;--adv:#f0c46f;--adv-soft:#433616;--danger:#ff9b90;--danger-soft:#482621;--ok:#85d6a5;--ok-soft:#173a27}}
    text{fill:var(--ink);font-family:Inter,ui-sans-serif,system-ui,sans-serif}.title{font-size:34px;font-weight:700}.label{font-size:29px;font-weight:700}.body{font-size:26px}.muted{fill:var(--muted)}.semantic{fill:none;stroke:var(--adv);stroke-width:4}.transport{fill:var(--gen-soft);stroke:var(--gen);stroke-width:3}.gate{fill:var(--panel);stroke:var(--line);stroke-width:3}.accepted{fill:var(--ok-soft);stroke:var(--ok);stroke-width:3}.flow{fill:none;stroke:var(--gen);stroke-width:3;marker-end:url(#arrow)}.retry{stroke:var(--adv);stroke-dasharray:12 8}.error{stroke:var(--danger);stroke-dasharray:8 7}
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs>
  <rect width="800" height="1200" fill="var(--bg)"/>
  <text class="title" x="400" y="55" text-anchor="middle">Two retry clocks guard different failures</text>

  <rect class="semantic" x="55" y="105" width="690" height="735" rx="12"/>
  <rect x="90" y="82" width="430" height="55" fill="var(--bg)"/>
  <text class="label" x="105" y="120">TOPIC SCOPE • ≤2 semantic attempts</text>

  <rect class="transport" x="145" y="180" width="510" height="180" rx="8"/>
  <text class="label" x="400" y="230" text-anchor="middle">Hosted generation request</text>
  <text class="label" x="400" y="278" text-anchor="middle">≤3 transport attempts</text>
  <text class="body muted" x="400" y="326" text-anchor="middle">network/provider delivery only</text>
  <path class="flow" d="M400 360V425" vector-effect="non-scaling-stroke"/>

  <path class="gate" d="M400 425L680 545L400 665L120 545Z"/>
  <text class="label" x="400" y="487" text-anchor="middle">Local semantic validation</text>
  <text class="body" x="400" y="530" text-anchor="middle">strict schema • ≤1,024 words</text>
  <text class="body" x="400" y="571" text-anchor="middle">1–3 unique allowed citations</text>
  <text class="body" x="400" y="612" text-anchor="middle">exact-hint compatibility</text>

  <path class="flow retry" d="M120 545H75V270H145" vector-effect="non-scaling-stroke"/>
  <text class="body" x="95" y="735">retryable</text>
  <text class="body" x="95" y="773">semantic</text>
  <text class="body" x="95" y="811">failure</text>
  <path class="flow" d="M400 665V755" vector-effect="non-scaling-stroke"/>
  <rect class="accepted" x="185" y="750" width="430" height="70" rx="8"/>
  <text class="label" x="400" y="796" text-anchor="middle">Validated raw document IDs</text>

  <path class="flow" d="M400 840V915" vector-effect="non-scaling-stroke"/>
  <rect class="transport" x="105" y="925" width="590" height="135" rx="8"/>
  <text class="label" x="400" y="973" text-anchor="middle">Deterministic citation conversion</text>
  <text class="body" x="400" y="1018" text-anchor="middle">prune uncited references • preserve support</text>
  <text class="body" x="400" y="1052" text-anchor="middle">raw doc IDs → organizer indexes</text>

  <path class="flow" d="M400 1060V1120" vector-effect="non-scaling-stroke"/>
  <rect class="accepted" x="180" y="1125" width="440" height="60" rx="8"/>
  <text class="label" x="400" y="1167" text-anchor="middle">Organizer-valid answer row</text>
</svg>
