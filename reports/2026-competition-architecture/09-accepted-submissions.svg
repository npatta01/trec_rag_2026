<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="acc-title acc-desc">
  <title id="acc-title">Five files, two different validators, and an exact-bytes gate</title>
  <desc id="acc-desc">Five file shapes on the left, grouped by task. Three Retrieval TSVs sit in the teal group, each 4,246 rows at depth 1 to 121, carrying their run identifiers and priority order. Two RAG JSONLs sit in the indigo group, each 119 valid reports. Each group feeds its own validator: the Retrieval files cross a structural check of six fields, exact topics, dense ranks, finite non-increasing scores, unique ClimbMix document IDs and a stable run ID; the RAG files cross organizer AutoJudge for schema, topics, narratives, citations and word limits. Both paths then meet one SHA-256 comparison against the submission ledger, and all five leave it marked accepted by Evalbase.</desc>
  <style>
    :root{color-scheme:light dark;--bg:#f6f8f7;--panel:#fff;--ink:#13231c;--muted:#4b5d54;--line:#5e6d66;--hair:#cdd8d1;--ret:#087c72;--ret-soft:#d9f1ed;--gen:#5664c7;--gen-soft:#e6e9ff;--ok:#277a45;--ok-soft:#ddf2e3;--adv:#91610d;--adv-soft:#faecc7;--stop:#b3261e;--stop-soft:#fbe4e2}
    @media (prefers-color-scheme: dark){:root{--bg:#0d1411;--panel:#17211c;--ink:#f0f6f2;--muted:#bac7bf;--line:#9cada3;--hair:#2f3b35;--ret:#69d8ca;--ret-soft:#183d38;--gen:#aab4ff;--gen-soft:#242b57;--ok:#82dda0;--ok-soft:#173c25;--adv:#f0c46f;--adv-soft:#433616;--stop:#f2b8b5;--stop-soft:#42211f}}
    text{fill:var(--ink);font-family:Inter,ui-sans-serif,system-ui,sans-serif}
    .h{font-size:25px;font-weight:700}
    .u{font-size:20px;font-weight:700}
    .lab{font-size:18px;font-weight:650}
    .s{font-size:16px;fill:var(--muted)}
    .tiny{font-size:14px;fill:var(--muted)}
    .mono{font-size:15px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;fill:var(--ink)}
    .panel{fill:var(--panel);stroke:var(--hair);stroke-width:2}
    .ret{fill:var(--ret-soft);stroke:var(--ret);stroke-width:2.5}
    .gen{fill:var(--gen-soft);stroke:var(--gen);stroke-width:2.5}
    .ok{fill:var(--ok-soft);stroke:var(--ok);stroke-width:2.5}
    .adv{fill:var(--adv-soft);stroke:var(--adv);stroke-width:2.5}
    .flow{fill:none;stroke:var(--line);stroke-width:2.5;marker-end:url(#a)}
    .retflow{stroke:var(--ret)}
    .genflow{stroke:var(--gen)}
    .advflow{stroke:var(--adv);stroke-dasharray:7 5}
    .barred{fill:none;stroke:var(--stop);stroke-width:2.5;stroke-dasharray:7 5}
    .stopbar{stroke:var(--stop);stroke-width:5;stroke-linecap:round}
    .sep{stroke:var(--hair);stroke-width:2}
    .bound{stroke:var(--ret);stroke-width:3;stroke-dasharray:10 6}
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs>

  <rect width="1000" height="560" fill="var(--bg)"/>
  <text class="h" x="40" y="46">Five files, two validators, one hash check</text>
  <text class="lab" x="40" y="102" fill="var(--ret)">Retrieval task</text>
  <rect class="ret" x="40" y="118" width="282" height="50" rx="7" vector-effect="non-scaling-stroke"/>
  <path d="M304 132 l0 -14 14 14z" fill="var(--ret)" opacity=".45"/>
  <text class="mono" x="56" y="142">r26-narr-facet-v1</text>
  <text class="tiny" x="56" y="160">priority 1 · combo · 4,246 rows</text>
  <rect class="ret" x="40" y="180" width="282" height="50" rx="7" vector-effect="non-scaling-stroke"/>
  <path d="M304 194 l0 -14 14 14z" fill="var(--ret)" opacity=".45"/>
  <text class="mono" x="56" y="204">r26-facet-breadth-v1</text>
  <text class="tiny" x="56" y="222">priority 2 · breadth · 4,246 rows</text>
  <rect class="ret" x="40" y="242" width="282" height="50" rx="7" vector-effect="non-scaling-stroke"/>
  <path d="M304 256 l0 -14 14 14z" fill="var(--ret)" opacity=".45"/>
  <text class="mono" x="56" y="266">r26-narrative-v1</text>
  <text class="tiny" x="56" y="284">priority 3 · narrative · 4,246 rows</text>
  <text class="lab" x="40" y="332" fill="var(--gen)">RAG task</text>
  <rect class="gen" x="40" y="348" width="282" height="50" rx="7" vector-effect="non-scaling-stroke"/>
  <path d="M304 362 l0 -14 14 14z" fill="var(--gen)" opacity=".45"/>
  <text class="mono" x="56" y="372">rag26-ms1-final</text>
  <text class="tiny" x="56" y="390">priority 1 · multi-stage · 119 valid reports</text>
  <rect class="gen" x="40" y="410" width="282" height="50" rx="7" vector-effect="non-scaling-stroke"/>
  <path d="M304 424 l0 -14 14 14z" fill="var(--gen)" opacity=".45"/>
  <text class="mono" x="56" y="434">rag26-ss1</text>
  <text class="tiny" x="56" y="452">priority 2 · single-pass · 119 valid reports</text>
  <path class="flow retflow" d="M322 182H386" vector-effect="non-scaling-stroke"/>
  <path class="flow genflow" d="M322 404H386" vector-effect="non-scaling-stroke"/>
  <rect class="panel" x="386" y="120" width="250" height="124" rx="10" vector-effect="non-scaling-stroke"/>
  <text class="lab" x="511" y="152" text-anchor="middle">Retrieval format check</text>
  <text class="tiny" x="404" y="180">six fields · exact 119 topics</text>
  <text class="tiny" x="404" y="202">dense ranks · finite, non-increasing</text>
  <text class="tiny" x="404" y="224">unique ClimbMix IDs · stable run ID</text>
  <rect class="panel" x="386" y="342" width="250" height="124" rx="10" vector-effect="non-scaling-stroke"/>
  <text class="lab" x="511" y="374" text-anchor="middle">organizer AutoJudge</text>
  <text class="tiny" x="404" y="402">schema · topics · narratives</text>
  <text class="tiny" x="404" y="424">citations · ≤ 1,024 words</text>
  <text class="tiny" x="404" y="446">119 of 119 valid, no extras</text>
  <path class="flow retflow" d="M636 182H700V270H736" vector-effect="non-scaling-stroke"/>
  <path class="flow genflow" d="M636 404H700V314H736" vector-effect="non-scaling-stroke"/>
  <rect class="adv" x="736" y="252" width="224" height="76" rx="10" vector-effect="non-scaling-stroke"/>
  <text class="lab" x="848" y="284" text-anchor="middle">SHA-256 matches</text>
  <text class="tiny" x="848" y="310" text-anchor="middle">ledger and bundle metadata</text>
  <path class="flow" d="M848 328V376" vector-effect="non-scaling-stroke"/>
  <rect class="ok" x="700" y="376" width="260" height="56" rx="28" vector-effect="non-scaling-stroke"/>
  <text class="lab" x="830" y="410" text-anchor="middle">✓ Accepted by Evalbase</text>
  <text class="tiny" x="40" y="500">Every Retrieval file is 4,246 rows at depth 1–121. The ledger tracks the exact submitted bytes.</text>
  <text class="tiny" x="40" y="522">Acceptance means valid delivery, not comparative quality.</text>
</svg>
