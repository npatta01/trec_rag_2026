<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1120" role="img" aria-labelledby="matrix-title matrix-desc">
  <title id="matrix-title">One targeted score matrix feeds three Retrieval orderings</title>
  <desc id="matrix-desc">The shared candidate core is chunked and scored against the original narrative and every subnarrative. Cache-first Mixedbread scores form a complete targeted matrix and tied percentiles. Three ranking heads emit narrative plus subnarrative, evidence breadth, and narrative-only TSVs over identical document sets.</desc>
  <style>
    :root{color-scheme:light dark;--bg:#f6f8f7;--panel:#fff;--ink:#13231c;--muted:#4b5d54;--line:#5e6d66;--ret:#087c72;--ret-soft:#d9f1ed;--adv:#91610d;--adv-soft:#faecc7}
    @media (prefers-color-scheme: dark){:root{--bg:#0d1411;--panel:#17211c;--ink:#f0f6f2;--muted:#bac7bf;--line:#9cada3;--ret:#69d8ca;--ret-soft:#183d38;--adv:#f0c46f;--adv-soft:#433616}}
    text{fill:var(--ink);font-family:Inter,ui-sans-serif,system-ui,sans-serif}.title{font-size:33px;font-weight:700}.label{font-size:25px;font-weight:700}.body{font-size:21px}.small{font-size:18px}.muted{fill:var(--muted)}.stage{fill:var(--panel);stroke:var(--line);stroke-width:2}.ret{fill:var(--ret-soft);stroke:var(--ret);stroke-width:3}.adv{fill:var(--adv-soft);stroke:var(--adv);stroke-width:3}.flow{fill:none;stroke:var(--ret);stroke-width:3;marker-end:url(#arrow)}
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs>
  <rect width="800" height="1120" fill="var(--bg)"/><text class="title" x="400" y="54" text-anchor="middle">Eligibility stays fixed; only order changes</text>
  <rect class="ret" x="105" y="100" width="590" height="100" rx="9"/><text class="label" x="400" y="143" text-anchor="middle">Shared candidate core</text><text class="body muted" x="400" y="177" text-anchor="middle">4,246 topic–document pairs across 119 narratives</text>
  <path class="flow" d="M400 200V255" vector-effect="non-scaling-stroke"/>
  <rect class="stage" x="75" y="265" width="650" height="130" rx="9"/><text class="label" x="400" y="310" text-anchor="middle">Targeted candidate × semantic-unit matrix</text><text class="body" x="400" y="350" text-anchor="middle">original narrative + every subnarrative</text><text class="small muted" x="400" y="378" text-anchor="middle">documents → overlapping passages</text>
  <path class="flow" d="M400 395V450" vector-effect="non-scaling-stroke"/>
  <rect class="adv" x="75" y="460" width="650" height="130" rx="9"/><text class="label" x="400" y="505" text-anchor="middle">Cache-first Mixedbread completion</text><text class="body" x="400" y="545" text-anchor="middle">167,597 cached query–passage scores</text><text class="small muted" x="400" y="573" text-anchor="middle">zero misses • zero model batches</text>
  <path class="flow" d="M400 590V650" vector-effect="non-scaling-stroke"/>
  <rect class="stage" x="105" y="660" width="590" height="100" rx="9"/><text class="label" x="400" y="704" text-anchor="middle">Passage aggregation + tied percentiles</text><text class="small muted" x="400" y="738" text-anchor="middle">same candidate set remains eligible</text>
  <path class="flow" d="M400 760V820H140V855M400 820V855M400 820H660V855" vector-effect="non-scaling-stroke"/>
  <rect class="ret" x="25" y="865" width="230" height="180" rx="9"/><text class="label" x="140" y="910" text-anchor="middle">Combo</text><text class="small" x="140" y="950" text-anchor="middle">narrative + facets</text><text class="small muted" x="140" y="985" text-anchor="middle">r26-narr-facet-v1</text><text class="small muted" x="140" y="1018" text-anchor="middle">4,246 rows</text>
  <rect class="ret" x="285" y="865" width="230" height="180" rx="9"/><text class="label" x="400" y="910" text-anchor="middle">Breadth</text><text class="small" x="400" y="950" text-anchor="middle">facets + strong passages</text><text class="small muted" x="400" y="985" text-anchor="middle">r26-facet-breadth-v1</text><text class="small muted" x="400" y="1018" text-anchor="middle">4,246 rows</text>
  <rect class="ret" x="545" y="865" width="230" height="180" rx="9"/><text class="label" x="660" y="910" text-anchor="middle">Narrative</text><text class="small" x="660" y="950" text-anchor="middle">original percentile</text><text class="small muted" x="660" y="985" text-anchor="middle">r26-narrative-v1</text><text class="small muted" x="660" y="1018" text-anchor="middle">4,246 rows</text>
  <text class="body" x="400" y="1090" text-anchor="middle">Three accepted TSVs • identical per-narrative document sets</text>
</svg>
