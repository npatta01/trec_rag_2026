<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 716" role="img" aria-labelledby="runs-title runs-desc">
  <title id="runs-title">Three orderings over one identical document set</title>
  <desc id="runs-desc">One column on the left holds a narrative's candidate core as nine numbered documents. Three columns to the right hold the combo, breadth and narrative-only runs. Each right-hand column contains the same nine numbers in a different vertical order. Two documents are traced across all four columns with connecting lines to show that the membership never changes, only the rank. Every run emits 4,246 rows, and within a narrative the three files list the same documents.</desc>
  <style>
    :root{color-scheme:light dark;--bg:#f6f8f7;--panel:#fff;--ink:#13231c;--muted:#4b5d54;--line:#5e6d66;--hair:#cdd8d1;--ret:#087c72;--ret-soft:#d9f1ed;--gen:#5664c7;--gen-soft:#e6e9ff;--ok:#277a45;--ok-soft:#ddf2e3;--adv:#91610d;--adv-soft:#faecc7}
    @media (prefers-color-scheme: dark){:root{--bg:#0d1411;--panel:#17211c;--ink:#f0f6f2;--muted:#bac7bf;--line:#9cada3;--hair:#2f3b35;--ret:#69d8ca;--ret-soft:#183d38;--gen:#aab4ff;--gen-soft:#242b57;--ok:#82dda0;--ok-soft:#173c25;--adv:#f0c46f;--adv-soft:#433616}}
    text{fill:var(--ink);font-family:Inter,ui-sans-serif,system-ui,sans-serif}
    .h{font-size:25px;font-weight:700}
    .col{font-size:19px;font-weight:700}
    .s{font-size:16px;fill:var(--muted)}
    .mono{font-size:15px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;fill:var(--muted)}
    .chip{fill:var(--panel);stroke:var(--hair);stroke-width:2}
    .chipnum{font-size:16px;font-weight:650;fill:var(--muted)}
    .t1{stroke:var(--ret);stroke-width:3;fill:var(--ret-soft)}
    .t1n{font-size:16px;font-weight:800;fill:var(--ret)}
    .t2{stroke:var(--adv);stroke-width:3;fill:var(--adv-soft)}
    .t2n{font-size:16px;font-weight:800;fill:var(--adv)}
    .trace1{fill:none;stroke:var(--ret);stroke-width:2;opacity:.55}
    .trace2{fill:none;stroke:var(--adv);stroke-width:2;stroke-dasharray:6 4;opacity:.65}
    .rule{stroke:var(--hair);stroke-width:2}
  </style>

  <rect width="980" height="716" fill="var(--bg)"/>
  <text class="h" x="40" y="46">The order changes. The set does not.</text>
  <text class="s" x="40" y="78">Every candidate is scored against the untouched narrative and every subnarrative; the three heads read that one matrix.</text>
  <text class="col" x="120" y="122" text-anchor="middle">the candidate core</text>
  <text class="s" x="120" y="146" text-anchor="middle">one narrative</text>
