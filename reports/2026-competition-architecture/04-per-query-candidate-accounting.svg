<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" role="img" aria-labelledby="accounting-title accounting-desc">
  <title id="accounting-title">Candidate accounting for one focused query</title>
  <desc id="accounting-desc">For each original or planned query, Pyserini returns at most one thousand documents. Non-empty documents become overlapping chunks of at most 3500 characters with 350-character overlap. Mixedbread scores those chunks as passages, and one global top list retains at most one hundred passages for that query. Funnel widths are conceptual and not proportional.</desc>
  <style>
    :root{color-scheme:light dark;--bg:#f6f8f7;--panel:#fff;--ink:#13231c;--muted:#4b5d54;--line:#5e6d66;--ret:#087c72;--ret-soft:#d9f1ed;--ret-mid:#a9ddd5;--gen:#5664c7;--gen-soft:#e6e9ff;--adv:#91610d;--adv-soft:#faecc7}
    @media (prefers-color-scheme: dark){:root{--bg:#0d1411;--panel:#17211c;--ink:#f0f6f2;--muted:#bac7bf;--line:#9cada3;--ret:#69d8ca;--ret-soft:#183d38;--ret-mid:#245d56;--gen:#aab4ff;--gen-soft:#242b57;--adv:#f0c46f;--adv-soft:#433616}}
    text{fill:var(--ink);font-family:Inter,ui-sans-serif,system-ui,sans-serif}.title{font-size:34px;font-weight:700}.label{font-size:30px;font-weight:700}.body{font-size:26px}.muted{fill:var(--muted)}.query{fill:var(--panel);stroke:var(--ret);stroke-width:3}.tier-a{fill:var(--ret-soft);stroke:var(--ret);stroke-width:3}.tier-b{fill:var(--ret-mid);stroke:var(--ret);stroke-width:3}.unit{fill:var(--adv-soft);stroke:var(--adv);stroke-width:3}.result{fill:var(--gen-soft);stroke:var(--gen);stroke-width:3}.flow{fill:none;stroke:var(--ret);stroke-width:3;marker-end:url(#arrow)}
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs>
  <rect width="800" height="1200" fill="var(--bg)"/>
  <text class="title" x="400" y="44" text-anchor="middle">One focused query</text>
  <text class="title" x="400" y="82" text-anchor="middle">changes units as it narrows</text>
  <text class="body muted" x="400" y="119" text-anchor="middle">Conceptual funnel • widths are not proportional</text>

  <rect class="query" x="170" y="135" width="460" height="100" rx="8"/>
  <text class="label" x="400" y="178" text-anchor="middle">One focused query</text>
  <text class="body" x="400" y="216" text-anchor="middle">original narrative or planned BM25 query</text>
  <path class="flow" d="M400 235V295" vector-effect="non-scaling-stroke"/>

  <path class="tier-a" d="M70 305H730L675 490H125Z"/>
  <text class="label" x="400" y="365" text-anchor="middle">Pyserini → ClimbMix</text>
  <text class="label" x="400" y="418" text-anchor="middle">≤1,000 documents</text>
  <text class="body" x="400" y="461" text-anchor="middle">ceiling, not guaranteed count</text>

  <rect class="unit" x="120" y="520" width="560" height="105" rx="8"/>
  <text class="label" x="400" y="563" text-anchor="middle">Unit change: documents → chunks</text>
  <text class="body" x="400" y="603" text-anchor="middle">≤3500 characters • 350-character overlap</text>
  <path class="flow" d="M400 625V680" vector-effect="non-scaling-stroke"/>

  <path class="tier-b" d="M150 690H650L610 865H190Z"/>
  <text class="label" x="400" y="752" text-anchor="middle">Mixedbread reranks chunks</text>
  <text class="body" x="400" y="801" text-anchor="middle">Chunks now compete as passages</text>
  <text class="body" x="400" y="841" text-anchor="middle">one global ranking for this query</text>
  <path class="flow" d="M400 865V920" vector-effect="non-scaling-stroke"/>

  <path class="result" d="M225 930H575L550 1065H250Z"/>
  <text class="label" x="400" y="985" text-anchor="middle">≤100 passages</text>
  <text class="body" x="400" y="1032" text-anchor="middle">retained for this query</text>

  <path class="flow" d="M400 1065V1115" vector-effect="non-scaling-stroke"/>
  <rect class="query" x="85" y="1120" width="630" height="62" rx="8"/>
  <text class="body" x="400" y="1161" text-anchor="middle">Repeat independently for every query lane</text>
</svg>
