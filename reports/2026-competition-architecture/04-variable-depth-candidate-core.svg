<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 672" role="img" aria-labelledby="core-title core-desc">
  <title id="core-title">Each lane admits its own outliers, and the union sets the depth</title>
  <desc id="core-desc">Four score axes, one per authenticated source lane. Each axis carries that lane's retrieved documents placed by aggregate score, most of them low with a thin tail of high scorers. A dashed gate sits at the lane's own median plus 2.5 times 1.4826 times its median absolute deviation, so it falls in a different place on every axis. Documents to the right of a gate are filled and admitted; the rest stay hollow. The candidate core is the union of every lane's admissions, which across 119 narratives runs from 1 to 121 documents over 61 distinct depths and 4,246 topic-document pairs. Lane geometry is illustrative; the aggregate counts are observed.</desc>
  <style>
    :root{color-scheme:light dark;--bg:#f6f8f7;--panel:#fff;--ink:#13231c;--muted:#4b5d54;--line:#5e6d66;--hair:#cdd8d1;--ret:#087c72;--ret-soft:#d9f1ed;--gen:#5664c7;--gen-soft:#e6e9ff;--ok:#277a45;--ok-soft:#ddf2e3;--adv:#91610d;--adv-soft:#faecc7}
    @media (prefers-color-scheme: dark){:root{--bg:#0d1411;--panel:#17211c;--ink:#f0f6f2;--muted:#bac7bf;--line:#9cada3;--hair:#2f3b35;--ret:#69d8ca;--ret-soft:#183d38;--gen:#aab4ff;--gen-soft:#242b57;--ok:#82dda0;--ok-soft:#173c25;--adv:#f0c46f;--adv-soft:#433616}}
    text{fill:var(--ink);font-family:Inter,ui-sans-serif,system-ui,sans-serif}
    .h{font-size:25px;font-weight:700}
    .lane{font-size:19px;font-weight:650}
    .n{font-size:19px;font-weight:700;fill:var(--ret)}
    .s{font-size:17px;fill:var(--muted)}
    .mono{font-size:17px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;fill:var(--ink)}
    .axis{stroke:var(--hair);stroke-width:2}
    .gate{stroke:var(--ret);stroke-width:2.5;stroke-dasharray:7 5}
    .out{fill:none;stroke:var(--line);stroke-width:2}
    .in{fill:var(--ret)}
    .band{fill:var(--ret-soft);stroke:var(--ret);stroke-width:2}
  </style>

  <rect width="980" height="672" fill="var(--bg)"/>
  <text class="h" x="40" y="46">Each lane admits its own outliers</text>
  <text class="mono" x="40" y="80">admit d when A(d) ≥ median + 2.5 × 1.4826 × MAD   (MAD = 0: A(d) &gt; median)</text>
  <text class="lane" x="40" y="154">the untouched narrative</text>
