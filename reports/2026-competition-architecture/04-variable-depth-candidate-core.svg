<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1100" role="img" aria-labelledby="core-title core-desc">
  <title id="core-title">Robust lane admission creates a variable-depth candidate core</title>
  <desc id="core-desc">Authenticated original and subnarrative source lanes compute a median and median absolute deviation threshold. Admitted documents form an inclusive union. If empty, the best original-lane document survives. Observed final depth ranges from one to 121 documents.</desc>
  <style>
    :root{color-scheme:light dark;--bg:#f6f8f7;--panel:#fff;--ink:#13231c;--muted:#4b5d54;--line:#5e6d66;--ret:#087c72;--ret-soft:#d9f1ed;--adv:#91610d;--adv-soft:#faecc7}
    @media (prefers-color-scheme: dark){:root{--bg:#0d1411;--panel:#17211c;--ink:#f0f6f2;--muted:#bac7bf;--line:#9cada3;--ret:#69d8ca;--ret-soft:#183d38;--adv:#f0c46f;--adv-soft:#433616}}
    text{fill:var(--ink);font-family:Inter,ui-sans-serif,system-ui,sans-serif}.title{font-size:33px;font-weight:700}.label{font-size:26px;font-weight:700}.body{font-size:22px}.small{font-size:19px}.muted{fill:var(--muted)}.stage{fill:var(--panel);stroke:var(--line);stroke-width:2}.ret{fill:var(--ret-soft);stroke:var(--ret);stroke-width:3}.adv{fill:var(--adv-soft);stroke:var(--adv);stroke-width:3}.flow{fill:none;stroke:var(--ret);stroke-width:3;marker-end:url(#arrow)}.dash{stroke:var(--adv);stroke-dasharray:12 8}
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs>
  <rect width="800" height="1100" fill="var(--bg)"/><text class="title" x="400" y="54" text-anchor="middle">Robust admission chooses narrative-specific k</text>
  <rect class="ret" x="35" y="105" width="225" height="120" rx="9"/><text class="label" x="147" y="152" text-anchor="middle">Original lane</text><text class="small muted" x="147" y="190" text-anchor="middle">aggregate scores</text>
  <rect class="ret" x="288" y="105" width="225" height="120" rx="9"/><text class="label" x="400" y="152" text-anchor="middle">Facet lane 1</text><text class="small muted" x="400" y="190" text-anchor="middle">pooled subnarrative</text>
  <rect class="ret" x="540" y="105" width="225" height="120" rx="9"/><text class="label" x="652" y="152" text-anchor="middle">Facet lane n</text><text class="small muted" x="652" y="190" text-anchor="middle">authenticated source</text>
  <path class="flow" d="M147 225V300H400M400 225V300M652 225V300H400V335" vector-effect="non-scaling-stroke"/>
  <rect class="stage" x="80" y="345" width="640" height="165" rx="9"/><text class="label" x="400" y="392" text-anchor="middle">Robust gate inside every lane</text><text class="body" x="400" y="435" text-anchor="middle">MAD &gt; 0: score ≥ median + 2.5 × 1.4826 × MAD</text><text class="body" x="400" y="475" text-anchor="middle">MAD = 0: score &gt; median</text>
  <path class="flow" d="M400 510V575" vector-effect="non-scaling-stroke"/>
  <path class="ret" d="M400 575L655 680L400 785L145 680Z"/><text class="label" x="400" y="665" text-anchor="middle">Inclusive union</text><text class="body muted" x="400" y="705" text-anchor="middle">original ∪ every facet admission</text>
  <path class="flow dash" d="M145 680H65V865H175" vector-effect="non-scaling-stroke"/><rect class="adv" x="175" y="820" width="450" height="90" rx="9"/><text class="label" x="400" y="858" text-anchor="middle">Empty-union fallback</text><text class="small muted" x="400" y="890" text-anchor="middle">best original-lane document • never needed</text>
  <path class="flow" d="M400 785V950" vector-effect="non-scaling-stroke"/>
  <rect class="ret" x="100" y="960" width="600" height="115" rx="9"/><text class="label" x="400" y="1008" text-anchor="middle">Shared candidate core Cₜ</text><text class="body" x="400" y="1048" text-anchor="middle">1–121 documents • no padding • same set in all runs</text>
</svg>
