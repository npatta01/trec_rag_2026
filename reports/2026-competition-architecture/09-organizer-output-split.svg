<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" role="img" aria-labelledby="outputs-title outputs-desc">
  <title id="outputs-title">Retrieval and Generation publish separate organizer-facing outputs</title>
  <desc id="outputs-desc">Retrieval publishes an official TREC evidence run, a full-text ZIP, and a manifest-last export receipt. It separately publishes the authenticated selected-evidence handoff. Only that handoff crosses into Generation. Generation publishes the organizer RAG JSONL. The retrieval run and ZIP are sibling outputs, never generation inputs.</desc>
  <style>
    :root{color-scheme:light dark;--bg:#f6f8f7;--panel:#fff;--ink:#13231c;--muted:#4b5d54;--line:#5e6d66;--ret:#087c72;--ret-soft:#d9f1ed;--gen:#5664c7;--gen-soft:#e6e9ff;--danger:#b4493e;--danger-soft:#f9dedb}
    @media (prefers-color-scheme: dark){:root{--bg:#0d1411;--panel:#17211c;--ink:#f0f6f2;--muted:#bac7bf;--line:#9cada3;--ret:#69d8ca;--ret-soft:#183d38;--gen:#aab4ff;--gen-soft:#242b57;--danger:#ff9b90;--danger-soft:#482621}}
    text{fill:var(--ink);font-family:Inter,ui-sans-serif,system-ui,sans-serif}.title{font-size:34px;font-weight:700}.label{font-size:29px;font-weight:700}.body{font-size:26px}.muted{fill:var(--muted)}.retrieval{fill:var(--ret-soft);stroke:var(--ret);stroke-width:3}.generation{fill:var(--gen-soft);stroke:var(--gen);stroke-width:3}.artifact-ret{fill:var(--panel);stroke:var(--ret);stroke-width:3}.artifact-gen{fill:var(--panel);stroke:var(--gen);stroke-width:3}.blocked{fill:var(--danger-soft);stroke:var(--danger);stroke-width:2}.flow-ret{fill:none;stroke:var(--ret);stroke-width:3;marker-end:url(#arrow)}.flow-gen{fill:none;stroke:var(--gen);stroke-width:3;marker-end:url(#arrow)}.boundary{stroke:var(--ink);stroke-width:3;stroke-dasharray:16 9}.fold-ret{fill:var(--bg);stroke:var(--ret);stroke-width:2}.fold-gen{fill:var(--bg);stroke:var(--gen);stroke-width:2}
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs>
  <rect width="800" height="1200" fill="var(--bg)"/>
  <text class="title" x="400" y="55" text-anchor="middle">Two commands, two organizer deliverables</text>

  <rect class="retrieval" x="125" y="100" width="550" height="95" rx="8"/>
  <text class="label" x="400" y="158" text-anchor="middle">1 • Competition Retrieval</text>
  <path class="flow-ret" d="M400 195V255" vector-effect="non-scaling-stroke"/>

  <path class="artifact-ret" d="M35 325H245V500H35Z"/><path class="fold-ret" d="M195 325V375H245"/>
  <path class="artifact-ret" d="M295 325H505V500H295Z"/><path class="fold-ret" d="M455 325V375H505"/>
  <path class="artifact-ret" d="M555 325H765V500H555Z"/><path class="fold-ret" d="M715 325V375H765"/>
  <text class="body" x="140" y="405" text-anchor="middle">official TREC</text><text class="body" x="140" y="445" text-anchor="middle">evidence run</text>
  <text class="body" x="400" y="405" text-anchor="middle">full-text</text><text class="body" x="400" y="445" text-anchor="middle">ZIP</text>
  <text class="body" x="660" y="405" text-anchor="middle">manifest-last</text><text class="body" x="660" y="445" text-anchor="middle">export receipt</text>
  <path class="flow-ret" d="M400 195V270H140V325M400 270V325M400 270H660V325" vector-effect="non-scaling-stroke"/>
  <rect x="190" y="247" width="420" height="55" fill="var(--bg)"/>
  <text class="label" x="400" y="285" text-anchor="middle">Retrieval publishes siblings</text>

  <rect class="blocked" x="95" y="510" width="610" height="50" rx="6"/>
  <text class="body" x="400" y="544" text-anchor="middle">Run + ZIP stop here • never Generation inputs</text>
  <path class="artifact-ret" d="M145 575H655V725H145Z"/><path class="fold-ret" d="M595 575V635H655"/>
  <text class="label" x="400" y="625" text-anchor="middle">generation_handoff_manifest.json</text>
  <text class="body" x="400" y="670" text-anchor="middle">authenticated selected evidence</text>
  <text class="body muted" x="400" y="708" text-anchor="middle">the only artifact that crosses stages</text>
  <path class="flow-ret" d="M400 500V575" vector-effect="non-scaling-stroke"/>

  <line class="boundary" x1="45" y1="775" x2="755" y2="775" vector-effect="non-scaling-stroke"/>
  <rect x="95" y="746" width="610" height="56" fill="var(--bg)"/>
  <text class="body" x="400" y="784" text-anchor="middle">Retrieval / Generation boundary</text>
  <path class="flow-gen" d="M400 725V845" vector-effect="non-scaling-stroke"/>

  <rect class="generation" x="125" y="855" width="550" height="95" rx="8"/>
  <text class="label" x="400" y="913" text-anchor="middle">2 • GPT-5.6 Sol Generation</text>
  <path class="flow-gen" d="M400 950V1010" vector-effect="non-scaling-stroke"/>
  <path class="artifact-gen" d="M90 1020H710V1175H90Z"/><path class="fold-gen" d="M650 1020V1080H710"/>
  <text class="label" x="400" y="1080" text-anchor="middle">Organizer RAG JSONL</text>
  <text class="body" x="400" y="1128" text-anchor="middle">answers + deterministic citation indexes</text>

</svg>
