<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1100" role="img" aria-labelledby="handoff-title handoff-desc">
  <title id="handoff-title">The sealed handoff is the RAG trust boundary</title>
  <desc id="handoff-desc">The authenticated handoff contains exact narratives, 691 evidence groups, selected passages, advisory hints, allowed citation IDs, source receipts, and hashes for 119 topics. Single-pass and multi-stage RAG may consume it. Retrieval TSVs, the full-text ZIP, qrels, gold nuggets, and RAGDoll scores are barred.</desc>
  <style>
    :root{color-scheme:light dark;--bg:#f6f8f7;--panel:#fff;--ink:#13231c;--muted:#4b5d54;--line:#5e6d66;--ret:#087c72;--ret-soft:#d9f1ed;--gen:#5664c7;--gen-soft:#e6e9ff;--danger:#b4493e;--danger-soft:#f9dedb}
    @media (prefers-color-scheme: dark){:root{--bg:#0d1411;--panel:#17211c;--ink:#f0f6f2;--muted:#bac7bf;--line:#9cada3;--ret:#69d8ca;--ret-soft:#183d38;--gen:#aab4ff;--gen-soft:#242b57;--danger:#ff9b90;--danger-soft:#482621}}
    text{fill:var(--ink);font-family:Inter,ui-sans-serif,system-ui,sans-serif}.title{font-size:33px;font-weight:700}.label{font-size:25px;font-weight:700}.body{font-size:21px}.small{font-size:18px}.muted{fill:var(--muted)}.handoff{fill:var(--ret-soft);stroke:var(--ret);stroke-width:3}.gen{fill:var(--gen-soft);stroke:var(--gen);stroke-width:3}.blocked{fill:var(--danger-soft);stroke:var(--danger);stroke-width:3}.gate{fill:var(--panel);stroke:var(--line);stroke-width:3}.flow{fill:none;stroke:var(--gen);stroke-width:3;marker-end:url(#arrow)}.bar{stroke:var(--danger);stroke-width:5}
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs>
  <rect width="800" height="1100" fill="var(--bg)"/><text class="title" x="400" y="54" text-anchor="middle">Only selected evidence crosses into RAG</text>
  <path class="handoff" d="M70 110H730V535H70Z"/><path d="M650 110V190H730" fill="var(--bg)" stroke="var(--ret)" stroke-width="2"/>
  <text class="label" x="400" y="165" text-anchor="middle">generation_handoff_manifest.json</text>
  <text class="body" x="135" y="230">✓ exact narratives • 119 topics</text><text class="body" x="135" y="275">✓ selected passages • factual authority</text><text class="body" x="135" y="320">✓ 691 evidence groups</text><text class="body" x="135" y="365">✓ advisory canonical claim hints</text><text class="body" x="135" y="410">✓ allowed ClimbMix citation IDs</text><text class="body" x="135" y="455">✓ source receipts + canonical hashes</text><text class="small muted" x="400" y="505" text-anchor="middle">malformed or mismatched state fails closed</text>
  <path class="flow" d="M400 535V605" vector-effect="non-scaling-stroke"/><path class="gate" d="M400 605L600 680L400 755L200 680Z"/><text class="label" x="400" y="674" text-anchor="middle">Authenticate</text><text class="small muted" x="400" y="708" text-anchor="middle">schema • payload • context</text>
  <path class="flow" d="M400 755V825H210V865M400 825H590V865" vector-effect="non-scaling-stroke"/>
  <rect class="gen" x="45" y="875" width="330" height="105" rx="9"/><text class="label" x="210" y="920" text-anchor="middle">Single-pass Sol</text><text class="small muted" x="210" y="954" text-anchor="middle">complete selected context</text>
  <rect class="gen" x="425" y="875" width="330" height="105" rx="9"/><text class="label" x="590" y="920" text-anchor="middle">Multi-stage Luna + Sol</text><text class="small muted" x="590" y="954" text-anchor="middle">bounded plan, audit, revision</text>
  <rect class="blocked" x="55" y="1015" width="690" height="65" rx="9"/><text class="body" x="400" y="1054" text-anchor="middle">Retrieval TSV • full-text ZIP • qrels • gold nuggets • RAGDoll scores</text><line class="bar" x1="75" y1="1030" x2="725" y2="1065" vector-effect="non-scaling-stroke"/>
</svg>
