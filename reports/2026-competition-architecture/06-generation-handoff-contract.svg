<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="hand-title hand-desc">
  <title id="hand-title">One file crosses into Generation; five named artifacts stop at the line</title>
  <desc id="hand-desc">A dashed vertical boundary runs down the middle. On the left, the sealed generation handoff manifest lists what it carries: 119 exact narratives, 691 evidence groups, the selected passages, the advisory claim hints, the allowed ClimbMix citation IDs, and the source receipts and hashes. A solid arrow carries it through an authentication gate to the right-hand side, where single-pass Sol and multi-stage Luna plus Sol sit. Below it, five artifacts each send a dashed red line toward the boundary and each line is cut by a stop bar before it arrives: the accepted Retrieval TSV, the source full-text ZIP, qrels, gold nuggets, and RAGDoll scores. Malformed, contradictory, non-canonical or unauthenticated state fails the load rather than arriving incomplete.</desc>
  <style>
    :root{color-scheme:light dark;--bg:#f6f8f7;--panel:#fff;--ink:#13231c;--muted:#4b5d54;--line:#5e6d66;--hair:#cdd8d1;--ret:#087c72;--ret-soft:#d9f1ed;--gen:#5664c7;--gen-soft:#e6e9ff;--ok:#277a45;--ok-soft:#ddf2e3;--adv:#91610d;--adv-soft:#faecc7;--stop:#b3261e;--stop-soft:#fbe4e2}
    @media (prefers-color-scheme: dark){:root{--bg:#0d1411;--panel:#17211c;--ink:#f0f6f2;--muted:#bac7bf;--line:#9cada3;--hair:#2f3b35;--ret:#69d8ca;--ret-soft:#183d38;--gen:#aab4ff;--gen-soft:#242b57;--ok:#82dda0;--ok-soft:#173c25;--adv:#f0c46f;--adv-soft:#433616;--stop:#f2b8b5;--stop-soft:#42211f}}
    text{fill:var(--ink);font-family:Inter,ui-sans-serif,system-ui,sans-serif}
    .h{font-size:25px;font-weight:700}
    .u{font-size:20px;font-weight:700}
    .lab{font-size:18px;font-weight:650}
    .s{font-size:16px;fill:var(--muted)}
    .tiny{font-size:14px;fill:var(--muted)}
    .mono{font-size:15px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;fill:var(--ink)}
    .panel{fill:var(--panel);stroke:var(--hair);stroke-width:2}
    .ret{fill:var(--ret-soft);stroke:var(--ret);stroke-width:2.5}
    .gen{fill:var(--gen-soft);stroke:var(--gen);stroke-width:2.5}
    .ok{fill:var(--ok-soft);stroke:var(--ok);stroke-width:2.5}
    .adv{fill:var(--adv-soft);stroke:var(--adv);stroke-width:2.5}
    .flow{fill:none;stroke:var(--line);stroke-width:2.5;marker-end:url(#a)}
    .retflow{stroke:var(--ret)}
    .genflow{stroke:var(--gen)}
    .advflow{stroke:var(--adv);stroke-dasharray:7 5}
    .barred{fill:none;stroke:var(--stop);stroke-width:2.5;stroke-dasharray:7 5}
    .stopbar{stroke:var(--stop);stroke-width:5;stroke-linecap:round}
    .sep{stroke:var(--hair);stroke-width:2}
    .bound{stroke:var(--ret);stroke-width:3;stroke-dasharray:10 6}
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs>

  <rect width="1000" height="600" fill="var(--bg)"/>
  <text class="h" x="40" y="46">One file crosses. Five do not.</text>
  <path class="bound" d="M560 76V560" vector-effect="non-scaling-stroke"/>
  <text class="tiny" x="570" y="96" fill="var(--ret)">the trust boundary</text>
  <rect class="ret" x="40" y="96" width="440" height="196" rx="10" vector-effect="non-scaling-stroke"/>
  <text class="mono" x="60" y="128">generation_handoff_manifest.json</text>
  <text class="tiny" x="60" y="156">✓ 119 exact narratives</text>
  <text class="tiny" x="60" y="178">✓ 691 evidence groups</text>
  <text class="tiny" x="60" y="200">✓ selected passages · factual authority</text>
  <text class="tiny" x="60" y="222">✓ advisory claim hints · never citable</text>
  <text class="tiny" x="60" y="244">✓ allowed ClimbMix citation IDs</text>
  <text class="tiny" x="60" y="266">✓ source receipts · canonical hashes</text>
  <path class="flow retflow" d="M480 194H554" vector-effect="non-scaling-stroke"/>
  <rect class="panel" x="590" y="150" width="170" height="44" rx="8" vector-effect="non-scaling-stroke"/>
  <text class="lab" x="675" y="178" text-anchor="middle">authenticate</text>
  <path class="flow retflow" d="M760 194H796" vector-effect="non-scaling-stroke"/>
  <rect class="gen" x="796" y="128" width="168" height="40" rx="10" vector-effect="non-scaling-stroke"/>
  <text class="lab" x="880" y="155" text-anchor="middle">single-pass Sol</text>
  <rect class="gen" x="796" y="180" width="168" height="40" rx="10" vector-effect="non-scaling-stroke"/>
  <text class="tiny" x="880" y="206" text-anchor="middle">multi-stage Luna + Sol</text>
  <text class="s" x="40" y="338">Everything else stops here:</text>
  <rect class="panel" x="40" y="348" width="300" height="34" rx="6" vector-effect="non-scaling-stroke"/>
  <text class="tiny" x="56" y="371">the accepted Retrieval TSV</text>
  <path class="barred" d="M340 365H490" vector-effect="non-scaling-stroke"/>
  <line class="stopbar" x1="498" y1="351" x2="498" y2="379" vector-effect="non-scaling-stroke"/>
  <rect class="panel" x="40" y="390" width="300" height="34" rx="6" vector-effect="non-scaling-stroke"/>
  <text class="tiny" x="56" y="413">the source full-text ZIP</text>
  <path class="barred" d="M340 407H490" vector-effect="non-scaling-stroke"/>
  <line class="stopbar" x1="498" y1="393" x2="498" y2="421" vector-effect="non-scaling-stroke"/>
  <rect class="panel" x="40" y="432" width="300" height="34" rx="6" vector-effect="non-scaling-stroke"/>
  <text class="tiny" x="56" y="455">qrels</text>
  <path class="barred" d="M340 449H490" vector-effect="non-scaling-stroke"/>
  <line class="stopbar" x1="498" y1="435" x2="498" y2="463" vector-effect="non-scaling-stroke"/>
  <rect class="panel" x="40" y="474" width="300" height="34" rx="6" vector-effect="non-scaling-stroke"/>
  <text class="tiny" x="56" y="497">gold nuggets</text>
  <path class="barred" d="M340 491H490" vector-effect="non-scaling-stroke"/>
  <line class="stopbar" x1="498" y1="477" x2="498" y2="505" vector-effect="non-scaling-stroke"/>
  <rect class="panel" x="40" y="516" width="300" height="34" rx="6" vector-effect="non-scaling-stroke"/>
  <text class="tiny" x="56" y="539">RAGDoll scores</text>
  <path class="barred" d="M340 533H490" vector-effect="non-scaling-stroke"/>
  <line class="stopbar" x1="498" y1="519" x2="498" y2="547" vector-effect="non-scaling-stroke"/>
  <text class="tiny" x="514" y="372" fill="var(--stop)">sibling branch output</text>
  <text class="tiny" x="514" y="456" fill="var(--stop)">evaluation and gold material</text>
  <text class="tiny" x="586" y="560">Malformed or unauthenticated state fails the load,</text>
  <text class="tiny" x="586" y="580">instead of arriving with a piece missing.</text>
</svg>
