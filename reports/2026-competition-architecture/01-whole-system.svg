<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1180" role="img" aria-labelledby="whole-title whole-desc">
  <title id="whole-title">One frozen source branches into five accepted runs</title>
  <desc id="whole-desc">An official narrative enters bounded source retrieval and the authenticated facet-deepseek-b40-v3 source. One sibling branch produces three variable-depth Retrieval TSVs. A sealed selected-evidence handoff feeds single-pass and multi-stage RAG, producing two JSONLs. All five are accepted by Evalbase.</desc>
  <style>
    :root{color-scheme:light dark;--bg:#f6f8f7;--panel:#fff;--ink:#13231c;--muted:#4b5d54;--line:#5e6d66;--ret:#087c72;--ret-soft:#d9f1ed;--gen:#5664c7;--gen-soft:#e6e9ff;--ok:#277a45;--ok-soft:#ddf2e3;--adv:#91610d;--adv-soft:#faecc7}
    @media (prefers-color-scheme: dark){:root{--bg:#0d1411;--panel:#17211c;--ink:#f0f6f2;--muted:#bac7bf;--line:#9cada3;--ret:#69d8ca;--ret-soft:#183d38;--gen:#aab4ff;--gen-soft:#242b57;--ok:#82dda0;--ok-soft:#173c25;--adv:#f0c46f;--adv-soft:#433616}}
    text{fill:var(--ink);font-family:Inter,ui-sans-serif,system-ui,sans-serif}.title{font-size:34px;font-weight:700}.label{font-size:27px;font-weight:700}.body{font-size:23px}.small{font-size:20px}.muted{fill:var(--muted)}.stage{fill:var(--panel);stroke:var(--line);stroke-width:2}.source{fill:var(--adv-soft);stroke:var(--adv);stroke-width:3}.retrieval{fill:var(--ret-soft);stroke:var(--ret);stroke-width:3}.generation{fill:var(--gen-soft);stroke:var(--gen);stroke-width:3}.accepted{fill:var(--ok-soft);stroke:var(--ok);stroke-width:3}.flow{fill:none;stroke:var(--line);stroke-width:3;marker-end:url(#arrow)}.ret-flow{stroke:var(--ret)}.gen-flow{stroke:var(--gen)}
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs>
  <rect width="800" height="1180" fill="var(--bg)"/>
  <text class="title" x="400" y="54" text-anchor="middle">Frozen source, two submission branches</text>
  <rect class="stage" x="130" y="90" width="540" height="90" rx="10"/><text class="label" x="400" y="145" text-anchor="middle">Official narrative</text>
  <path class="flow" d="M400 180V235" vector-effect="non-scaling-stroke"/>
  <rect class="stage" x="105" y="245" width="590" height="125" rx="10"/><text class="label" x="400" y="295" text-anchor="middle">Bounded source retrieval</text><text class="body muted" x="400" y="335" text-anchor="middle">plan once • BM25 • Mixedbread • selected evidence</text>
  <path class="flow" d="M400 370V420" vector-effect="non-scaling-stroke"/>
  <rect class="source" x="100" y="430" width="600" height="125" rx="10"/><text class="label" x="400" y="478" text-anchor="middle">Authenticated frozen source</text><text class="body" x="400" y="520" text-anchor="middle">facet-deepseek-b40-v3</text>
  <path class="flow ret-flow" d="M400 555V620H205V665" vector-effect="non-scaling-stroke"/><path class="flow gen-flow" d="M400 555V620H595V665" vector-effect="non-scaling-stroke"/>
  <rect class="retrieval" x="35" y="675" width="340" height="140" rx="10"/><text class="label" x="205" y="724" text-anchor="middle">Retrieval branch</text><text class="body" x="205" y="766" text-anchor="middle">robust candidate core</text><text class="small muted" x="205" y="798" text-anchor="middle">three orderings • identical sets</text>
  <rect class="generation" x="425" y="675" width="340" height="140" rx="10"/><text class="label" x="595" y="724" text-anchor="middle">RAG branch</text><text class="body" x="595" y="766" text-anchor="middle">sealed evidence handoff</text><text class="small muted" x="595" y="798" text-anchor="middle">single-pass + multi-stage</text>
  <path class="flow ret-flow" d="M205 815V875" vector-effect="non-scaling-stroke"/><path class="flow gen-flow" d="M595 815V875" vector-effect="non-scaling-stroke"/>
  <rect class="retrieval" x="35" y="885" width="340" height="120" rx="10"/><text class="label" x="205" y="934" text-anchor="middle">3 Retrieval TSVs</text><text class="body muted" x="205" y="975" text-anchor="middle">4,246 rows each • depth 1–121</text>
  <rect class="generation" x="425" y="885" width="340" height="120" rx="10"/><text class="label" x="595" y="934" text-anchor="middle">2 RAG JSONLs</text><text class="body muted" x="595" y="975" text-anchor="middle">119 valid reports each</text>
  <path class="flow" d="M205 1005V1050H400M595 1005V1050H400V1085" vector-effect="non-scaling-stroke"/>
  <rect class="accepted" x="150" y="1090" width="500" height="70" rx="35"/><text class="label" x="400" y="1135" text-anchor="middle">✓ Five files accepted by Evalbase</text>
</svg>
