<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="whole-title whole-desc">
  <title id="whole-title">One frozen source, two sibling submissions that never read each other</title>
  <desc id="whole-desc">One sealed source artifact on the left, facet-deepseek-b40-v3, holding the plan, the BM25 results, the passage scores, the selected passages and the claim hints. Two lanes leave it. The upper teal lane replays cached scores and emits three Retrieval TSVs, drawn as three ranked lists of the same documents in different order, 4,246 rows each at depth 1 to 121. The lower indigo lane takes a sealed selected-evidence handoff and emits two RAG JSONLs, drawn as answer sheets whose every line ends in a citation marker, 119 reports each. Between the two lanes a dashed red connector is cut by a stop bar: neither branch opens the other's output. All five files were accepted by Evalbase.</desc>
  <style>
    :root{color-scheme:light dark;--bg:#f6f8f7;--panel:#fff;--ink:#13231c;--muted:#4b5d54;--line:#5e6d66;--hair:#cdd8d1;--ret:#087c72;--ret-soft:#d9f1ed;--gen:#5664c7;--gen-soft:#e6e9ff;--ok:#277a45;--ok-soft:#ddf2e3;--adv:#91610d;--adv-soft:#faecc7;--stop:#b3261e;--stop-soft:#fbe4e2}
    @media (prefers-color-scheme: dark){:root{--bg:#0d1411;--panel:#17211c;--ink:#f0f6f2;--muted:#bac7bf;--line:#9cada3;--hair:#2f3b35;--ret:#69d8ca;--ret-soft:#183d38;--gen:#aab4ff;--gen-soft:#242b57;--ok:#82dda0;--ok-soft:#173c25;--adv:#f0c46f;--adv-soft:#433616;--stop:#f2b8b5;--stop-soft:#42211f}}
    text{fill:var(--ink);font-family:Inter,ui-sans-serif,system-ui,sans-serif}
    .h{font-size:25px;font-weight:700}
    .u{font-size:20px;font-weight:700}
    .lab{font-size:18px;font-weight:650}
    .s{font-size:16px;fill:var(--muted)}
    .tiny{font-size:14px;fill:var(--muted)}
    .mono{font-size:15px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;fill:var(--ink)}
    .panel{fill:var(--panel);stroke:var(--hair);stroke-width:2}
    .ret{fill:var(--ret-soft);stroke:var(--ret);stroke-width:2.5}
    .gen{fill:var(--gen-soft);stroke:var(--gen);stroke-width:2.5}
    .ok{fill:var(--ok-soft);stroke:var(--ok);stroke-width:2.5}
    .adv{fill:var(--adv-soft);stroke:var(--adv);stroke-width:2.5}
    .flow{fill:none;stroke:var(--line);stroke-width:2.5;marker-end:url(#a)}
    .retflow{stroke:var(--ret)}
    .genflow{stroke:var(--gen)}
    .advflow{stroke:var(--adv);stroke-dasharray:7 5}
    .barred{fill:none;stroke:var(--stop);stroke-width:2.5;stroke-dasharray:7 5}
    .stopbar{stroke:var(--stop);stroke-width:5;stroke-linecap:round}
    .sep{stroke:var(--hair);stroke-width:2}
    .bound{stroke:var(--ret);stroke-width:3;stroke-dasharray:10 6}
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs>

  <rect width="1000" height="560" fill="var(--bg)"/>
  <text class="h" x="40" y="46">One source. Two branches that never read each other.</text>
  <rect class="adv" x="40" y="110" width="230" height="150" rx="10" vector-effect="non-scaling-stroke"/>
  <text class="u" x="155" y="152" text-anchor="middle">frozen source</text>
  <text class="mono" x="155" y="182" text-anchor="middle">facet-deepseek-b40-v3</text>
  <text class="tiny" x="155" y="212" text-anchor="middle">plan · BM25 · scores</text>
  <text class="tiny" x="155" y="234" text-anchor="middle">passages · hints</text>
  <path class="flow retflow" d="M270 150H318" vector-effect="non-scaling-stroke"/>
  <path class="flow genflow" d="M270 222H318" vector-effect="non-scaling-stroke"/>
  <text class="lab" x="330" y="108" fill="var(--ret)">Retrieval · three orderings</text>
  <rect class="panel" x="330" y="122" width="96" height="104" rx="7" vector-effect="non-scaling-stroke"/>
  <text class="tiny" x="378" y="144" text-anchor="middle">doc 2</text>
  <text class="tiny" x="378" y="166" text-anchor="middle">doc 1</text>
  <text class="tiny" x="378" y="188" text-anchor="middle">doc 3</text>
  <text class="tiny" x="378" y="210" text-anchor="middle">doc 4</text>
  <rect class="panel" x="442" y="122" width="96" height="104" rx="7" vector-effect="non-scaling-stroke"/>
  <text class="tiny" x="490" y="144" text-anchor="middle">doc 3</text>
  <text class="tiny" x="490" y="166" text-anchor="middle">doc 2</text>
  <text class="tiny" x="490" y="188" text-anchor="middle">doc 1</text>
  <text class="tiny" x="490" y="210" text-anchor="middle">doc 4</text>
  <rect class="panel" x="554" y="122" width="96" height="104" rx="7" vector-effect="non-scaling-stroke"/>
  <text class="tiny" x="602" y="144" text-anchor="middle">doc 1</text>
  <text class="tiny" x="602" y="166" text-anchor="middle">doc 3</text>
  <text class="tiny" x="602" y="188" text-anchor="middle">doc 2</text>
  <text class="tiny" x="602" y="210" text-anchor="middle">doc 4</text>
  <text class="tiny" x="330" y="248">same documents per narrative · 4,246 rows each · depth 1–121</text>
  <text class="lab" x="330" y="300" fill="var(--gen)">RAG · two cited answers</text>
  <rect class="panel" x="330" y="314" width="132" height="118" rx="7" vector-effect="non-scaling-stroke"/>
  <line class="sep" x1="342" y1="336" x2="426" y2="336" vector-effect="non-scaling-stroke"/>
  <circle cx="438" cy="332" r="4" fill="var(--gen)"/>
  <line class="sep" x1="342" y1="356" x2="426" y2="356" vector-effect="non-scaling-stroke"/>
  <circle cx="438" cy="352" r="4" fill="var(--gen)"/>
  <line class="sep" x1="342" y1="376" x2="426" y2="376" vector-effect="non-scaling-stroke"/>
  <circle cx="438" cy="372" r="4" fill="var(--gen)"/>
  <line class="sep" x1="342" y1="396" x2="426" y2="396" vector-effect="non-scaling-stroke"/>
  <circle cx="438" cy="392" r="4" fill="var(--gen)"/>
  <line class="sep" x1="342" y1="416" x2="426" y2="416" vector-effect="non-scaling-stroke"/>
  <circle cx="438" cy="412" r="4" fill="var(--gen)"/>
  <rect class="panel" x="480" y="314" width="132" height="118" rx="7" vector-effect="non-scaling-stroke"/>
  <line class="sep" x1="492" y1="336" x2="576" y2="336" vector-effect="non-scaling-stroke"/>
  <circle cx="588" cy="332" r="4" fill="var(--gen)"/>
  <line class="sep" x1="492" y1="356" x2="576" y2="356" vector-effect="non-scaling-stroke"/>
  <circle cx="588" cy="352" r="4" fill="var(--gen)"/>
  <line class="sep" x1="492" y1="376" x2="576" y2="376" vector-effect="non-scaling-stroke"/>
  <circle cx="588" cy="372" r="4" fill="var(--gen)"/>
  <line class="sep" x1="492" y1="396" x2="576" y2="396" vector-effect="non-scaling-stroke"/>
  <circle cx="588" cy="392" r="4" fill="var(--gen)"/>
  <line class="sep" x1="492" y1="416" x2="576" y2="416" vector-effect="non-scaling-stroke"/>
  <circle cx="588" cy="412" r="4" fill="var(--gen)"/>
  <text class="tiny" x="330" y="452">every line ends in a citation · 119 reports each · ≤ 1,024 words</text>
  <path class="barred" d="M700 252V300" vector-effect="non-scaling-stroke"/>
  <line class="stopbar" x1="686" y1="276" x2="714" y2="276" vector-effect="non-scaling-stroke"/>
  <text class="tiny" x="730" y="264" fill="var(--stop)">no path between them</text>
  <text class="tiny" x="730" y="286" fill="var(--stop)">neither reads the other</text>
  <rect class="ok" x="330" y="480" width="470" height="50" rx="25" vector-effect="non-scaling-stroke"/>
  <text class="lab" x="565" y="512" text-anchor="middle">✓ Five files accepted by Evalbase</text>
</svg>
