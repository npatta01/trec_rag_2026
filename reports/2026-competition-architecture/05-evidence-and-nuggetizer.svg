<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" role="img" aria-labelledby="evidence-title evidence-desc">
  <title id="evidence-title">Selected evidence remains authoritative while Nuggetizer adds advisory hints</title>
  <desc id="evidence-desc">Top passages are processed locally through exact-span scoring, deduplication, diversity clustering, and a budget of at most forty selected evidence items per subnarrative. Those passages are factual authority. The same selected passages may be sent once to Nuggetizer, which returns at most twenty advisory claim hints with at most three supporting documents per claim. Canonicalization failure leaves exact extractive evidence intact.</desc>
  <style>
    :root{color-scheme:light dark;--bg:#f6f8f7;--panel:#fff;--ink:#13231c;--muted:#4b5d54;--line:#5e6d66;--ret:#087c72;--ret-soft:#d9f1ed;--adv:#91610d;--adv-soft:#faecc7;--danger:#b4493e;--danger-soft:#f9dedb}
    @media (prefers-color-scheme: dark){:root{--bg:#0d1411;--panel:#17211c;--ink:#f0f6f2;--muted:#bac7bf;--line:#9cada3;--ret:#69d8ca;--ret-soft:#183d38;--adv:#f0c46f;--adv-soft:#433616;--danger:#ff9b90;--danger-soft:#482621}}
    text{fill:var(--ink);font-family:Inter,ui-sans-serif,system-ui,sans-serif}.title{font-size:34px;font-weight:700}.label{font-size:29px;font-weight:700}.body{font-size:26px}.muted{fill:var(--muted)}.stage{fill:var(--panel);stroke:var(--line);stroke-width:2}.retrieval{fill:var(--ret-soft);stroke:var(--ret);stroke-width:3}.advisory-box{fill:var(--adv-soft);stroke:var(--adv);stroke-width:3}.fallback{fill:var(--danger-soft);stroke:var(--danger);stroke-width:3}.flow{fill:none;stroke:var(--ret);stroke-width:3;marker-end:url(#arrow)}.advisory{stroke:var(--adv);stroke-dasharray:12 8}.failure{stroke:var(--danger);stroke-dasharray:8 7}
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs>
  <rect width="800" height="1200" fill="var(--bg)"/>
  <text class="title" x="400" y="55" text-anchor="middle">Evidence first; canonical hints second</text>

  <rect class="stage" x="130" y="100" width="540" height="100" rx="8"/>
  <text class="label" x="400" y="143" text-anchor="middle">Top passages for one subnarrative</text>
  <text class="body muted" x="400" y="181" text-anchor="middle">ranked candidates—not selected yet</text>
  <path class="flow" d="M400 200V260" vector-effect="non-scaling-stroke"/>

  <rect class="retrieval" x="100" y="270" width="600" height="180" rx="8"/>
  <text class="label" x="400" y="316" text-anchor="middle">Local extractive selection</text>
  <text class="body" x="400" y="354" text-anchor="middle">exact spans → deduplicate</text>
  <text class="body" x="400" y="394" text-anchor="middle">cluster for diversity → select</text>
  <text class="body" x="400" y="432" text-anchor="middle">≤40 evidence items / subnarrative</text>
  <path class="flow" d="M300 450V535" vector-effect="non-scaling-stroke"/>

  <rect class="retrieval" x="55" y="545" width="480" height="155" rx="8"/>
  <text class="label" x="295" y="593" text-anchor="middle">Selected passages</text>
  <text class="label" x="295" y="640" text-anchor="middle">FACTUAL AUTHORITY</text>
  <text class="body" x="295" y="680" text-anchor="middle">exact source spans and provenance</text>

  <path class="flow advisory" d="M535 622H705V745" vector-effect="non-scaling-stroke"/>
  <rect class="advisory-box" x="150" y="755" width="550" height="185" rx="8"/>
  <text class="label" x="425" y="804" text-anchor="middle">Nuggetizer • one hosted call max</text>
  <text class="body" x="425" y="851" text-anchor="middle">≤20 canonical claim hints / subnarrative</text>
  <text class="body" x="425" y="894" text-anchor="middle">≤3 supporting documents / claim</text>
  <text class="body" x="425" y="927" text-anchor="middle">ADVISORY—not new factual evidence</text>

  <path class="flow failure" d="M150 850H55V995H150" vector-effect="non-scaling-stroke"/>
  <rect class="fallback" x="150" y="965" width="550" height="105" rx="8"/>
  <text class="label" x="425" y="1008" text-anchor="middle">If canonicalization fails</text>
  <text class="body" x="425" y="1048" text-anchor="middle">exact extractive evidence remains intact</text>

  <path class="flow" d="M295 700V730H95V1150H145" vector-effect="non-scaling-stroke"/>
  <path class="flow advisory" d="M700 875H755V1128H400" vector-effect="non-scaling-stroke"/>
  <rect class="stage" x="65" y="1115" width="670" height="70" rx="8"/>
  <text class="label" x="400" y="1161" text-anchor="middle">Handoff: evidence + advisory hints</text>
</svg>
