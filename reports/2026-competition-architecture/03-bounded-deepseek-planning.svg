<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-labelledby="plan-title plan-desc">
  <title id="plan-title">The planner may widen the search once, and never sees a result</title>
  <desc id="plan-desc">The complete official narrative enters at the left and splits two ways. The upper path bypasses the planner entirely: the untouched narrative always survives as one query lane. The lower path makes one DeepSeek V4 Flash call, which may return between zero and eight subnarratives, each carrying 1-3 BM25 queries each, for at most 25 searches per topic including the original lane. A schema or semantic failure falls back to the original lane alone. A dashed red arc curves from the executed searches back toward the planner and is cut by a stop bar: no retrieved result ever returns to planning, so there is no search and replan loop.</desc>
  <style>
    :root{color-scheme:light dark;--bg:#f6f8f7;--panel:#fff;--ink:#13231c;--muted:#4b5d54;--line:#5e6d66;--hair:#cdd8d1;--ret:#087c72;--ret-soft:#d9f1ed;--gen:#5664c7;--gen-soft:#e6e9ff;--ok:#277a45;--ok-soft:#ddf2e3;--adv:#91610d;--adv-soft:#faecc7;--stop:#b3261e;--stop-soft:#fbe4e2}
    @media (prefers-color-scheme: dark){:root{--bg:#0d1411;--panel:#17211c;--ink:#f0f6f2;--muted:#bac7bf;--line:#9cada3;--hair:#2f3b35;--ret:#69d8ca;--ret-soft:#183d38;--gen:#aab4ff;--gen-soft:#242b57;--ok:#82dda0;--ok-soft:#173c25;--adv:#f0c46f;--adv-soft:#433616;--stop:#f2b8b5;--stop-soft:#42211f}}
    text{fill:var(--ink);font-family:Inter,ui-sans-serif,system-ui,sans-serif}
    .h{font-size:25px;font-weight:700}
    .u{font-size:20px;font-weight:700}
    .lab{font-size:18px;font-weight:650}
    .s{font-size:16px;fill:var(--muted)}
    .tiny{font-size:14px;fill:var(--muted)}
    .mono{font-size:15px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;fill:var(--ink)}
    .panel{fill:var(--panel);stroke:var(--hair);stroke-width:2}
    .ret{fill:var(--ret-soft);stroke:var(--ret);stroke-width:2.5}
    .gen{fill:var(--gen-soft);stroke:var(--gen);stroke-width:2.5}
    .ok{fill:var(--ok-soft);stroke:var(--ok);stroke-width:2.5}
    .adv{fill:var(--adv-soft);stroke:var(--adv);stroke-width:2.5}
    .flow{fill:none;stroke:var(--line);stroke-width:2.5;marker-end:url(#a)}
    .retflow{stroke:var(--ret)}
    .genflow{stroke:var(--gen)}
    .advflow{stroke:var(--adv);stroke-dasharray:7 5}
    .barred{fill:none;stroke:var(--stop);stroke-width:2.5;stroke-dasharray:7 5}
    .stopbar{stroke:var(--stop);stroke-width:5;stroke-linecap:round}
    .sep{stroke:var(--hair);stroke-width:2}
    .bound{stroke:var(--ret);stroke-width:3;stroke-dasharray:10 6}
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs>

  <rect width="1000" height="540" fill="var(--bg)"/>
  <text class="h" x="40" y="46">Planning widens once, and never sees a result</text>
  <rect class="panel" x="40" y="118" width="210" height="92" rx="10" vector-effect="non-scaling-stroke"/>
  <text class="lab" x="145" y="152" text-anchor="middle">official narrative</text>
  <text class="tiny" x="145" y="180" text-anchor="middle">complete and unchanged</text>
  <path class="flow retflow" d="M250 142H300V108H352" vector-effect="non-scaling-stroke"/>
  <rect class="ret" x="352" y="80" width="250" height="58" rx="10" vector-effect="non-scaling-stroke"/>
  <text class="lab" x="477" y="116" text-anchor="middle">the untouched lane</text>
  <text class="tiny" x="612" y="116" fill="var(--ret)">always survives</text>
  <path class="flow advflow" d="M250 182H300V232H352" vector-effect="non-scaling-stroke"/>
  <rect class="adv" x="352" y="196" width="250" height="76" rx="10" vector-effect="non-scaling-stroke"/>
  <text class="lab" x="477" y="226" text-anchor="middle">one DeepSeek V4 Flash call</text>
  <text class="tiny" x="477" y="254" text-anchor="middle">0–8 subnarratives · schema checked</text>
  <path class="flow advflow" d="M602 234H652" vector-effect="non-scaling-stroke"/>
  <rect class="panel" x="652" y="196" width="190" height="24" rx="5" vector-effect="non-scaling-stroke"/>
  <text class="tiny" x="660" y="213">subnarrative · 1–3 BM25 queries each</text>
  <rect class="panel" x="652" y="226" width="190" height="24" rx="5" vector-effect="non-scaling-stroke"/>
  <text class="tiny" x="660" y="243">subnarrative · 1–3 queries</text>
  <rect class="panel" x="652" y="256" width="190" height="24" rx="5" vector-effect="non-scaling-stroke"/>
  <text class="tiny" x="660" y="273">… up to eight of them</text>
  <text class="tiny" x="652" y="302">at most 25 searches per topic, original lane included</text>
  <path class="barred" d="M842 330C842 400 500 400 480 352" vector-effect="non-scaling-stroke"/>
  <line class="stopbar" x1="648" y1="364" x2="676" y2="386" vector-effect="non-scaling-stroke"/>
  <text class="s" x="40" y="416" fill="var(--stop)">No result ever returns to the planner. There is no search-and-replan loop.</text>
  <line class="sep" x1="40" y1="452" x2="960" y2="452" vector-effect="non-scaling-stroke"/>
  <text class="s" x="40" y="482">If the plan does not parse or does not make sense, the original lane runs alone.</text>
  <text class="tiny" x="40" y="508">Breadth is the planner’s only job. The code owns every limit around it.</text>
</svg>
