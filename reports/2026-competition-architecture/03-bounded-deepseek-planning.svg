<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1050" role="img" aria-labelledby="planning-title planning-desc">
  <title id="planning-title">DeepSeek planning is bounded and one-shot</title>
  <desc id="planning-desc">The complete narrative always creates the original query lane. One strict DeepSeek V4 Flash request may add zero to eight subnarratives, each with one to three BM25 queries. Invalid planning falls back to the original-only path. Search results never return to the planner.</desc>
  <style>
    :root{color-scheme:light dark;--bg:#f6f8f7;--panel:#fff;--ink:#13231c;--muted:#4b5d54;--line:#5e6d66;--ret:#087c72;--ret-soft:#d9f1ed;--adv:#91610d;--adv-soft:#faecc7;--danger:#b4493e;--danger-soft:#f9dedb}
    @media (prefers-color-scheme: dark){:root{--bg:#0d1411;--panel:#17211c;--ink:#f0f6f2;--muted:#bac7bf;--line:#9cada3;--ret:#69d8ca;--ret-soft:#183d38;--adv:#f0c46f;--adv-soft:#433616;--danger:#ff9b90;--danger-soft:#482621}}
    text{fill:var(--ink);font-family:Inter,ui-sans-serif,system-ui,sans-serif}.title{font-size:34px;font-weight:700}.label{font-size:27px;font-weight:700}.body{font-size:23px}.small{font-size:20px}.muted{fill:var(--muted)}.stage{fill:var(--panel);stroke:var(--line);stroke-width:2}.ret{fill:var(--ret-soft);stroke:var(--ret);stroke-width:3}.adv{fill:var(--adv-soft);stroke:var(--adv);stroke-width:3}.blocked{fill:var(--danger-soft);stroke:var(--danger);stroke-width:3}.flow{fill:none;stroke:var(--ret);stroke-width:3;marker-end:url(#arrow)}.dash{stroke:var(--adv);stroke-dasharray:12 8}
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs>
  <rect width="800" height="1050" fill="var(--bg)"/><text class="title" x="400" y="56" text-anchor="middle">Planning can widen, never loop</text>
  <rect class="stage" x="125" y="100" width="550" height="105" rx="9"/><text class="label" x="400" y="148" text-anchor="middle">Complete official narrative</text><text class="body muted" x="400" y="183" text-anchor="middle">unchanged answer and retrieval contract</text>
  <path class="flow" d="M275 205V305" vector-effect="non-scaling-stroke"/><path class="flow dash" d="M525 205V260" vector-effect="non-scaling-stroke"/>
  <rect class="ret" x="55" y="315" width="330" height="125" rx="9"/><text class="label" x="220" y="365" text-anchor="middle">Original query lane</text><text class="body muted" x="220" y="405" text-anchor="middle">always preserved</text>
  <rect class="adv" x="415" y="270" width="330" height="170" rx="9"/><text class="label" x="580" y="320" text-anchor="middle">One strict DeepSeek call</text><text class="body" x="580" y="362" text-anchor="middle">0–8 subnarratives</text><text class="small muted" x="580" y="402" text-anchor="middle">schema + semantic validation</text>
  <path class="flow dash" d="M580 440V510" vector-effect="non-scaling-stroke"/>
  <rect class="adv" x="415" y="520" width="330" height="130" rx="9"/><text class="label" x="580" y="570" text-anchor="middle">1–3 BM25 queries each</text><text class="body muted" x="580" y="612" text-anchor="middle">≤24 planned lanes</text>
  <path class="flow" d="M220 440V720H400" vector-effect="non-scaling-stroke"/><path class="flow dash" d="M580 650V720H400V755" vector-effect="non-scaling-stroke"/>
  <rect class="ret" x="105" y="765" width="590" height="125" rx="9"/><text class="label" x="400" y="815" text-anchor="middle">1–25 executable query lanes</text><text class="body muted" x="400" y="855" text-anchor="middle">original plus validated plan</text>
  <rect class="blocked" x="140" y="930" width="520" height="80" rx="9"/><text class="label" x="400" y="970" text-anchor="middle">No search → planner feedback edge</text><text class="small muted" x="400" y="997" text-anchor="middle">invalid plan = original-only fallback</text>
  <path class="flow" d="M400 890V930" vector-effect="non-scaling-stroke"/>
</svg>
