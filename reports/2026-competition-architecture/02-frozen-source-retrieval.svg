<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1180" role="img" aria-labelledby="source-title source-desc">
  <title id="source-title">Bounded source retrieval freezes selected evidence</title>
  <desc id="source-desc">The original narrative and one-shot DeepSeek subnarratives create bounded BM25 query lanes. Pyserini searches climbmix-400b, documents become overlapping chunks, Mixedbread scores passages, local selection retains exact evidence, and Nuggetizer creates advisory hints before the source artifact is frozen.</desc>
  <style>
    :root{color-scheme:light dark;--bg:#f6f8f7;--panel:#fff;--ink:#13231c;--muted:#4b5d54;--line:#5e6d66;--ret:#087c72;--ret-soft:#d9f1ed;--adv:#91610d;--adv-soft:#faecc7}
    @media (prefers-color-scheme: dark){:root{--bg:#0d1411;--panel:#17211c;--ink:#f0f6f2;--muted:#bac7bf;--line:#9cada3;--ret:#69d8ca;--ret-soft:#183d38;--adv:#f0c46f;--adv-soft:#433616}}
    text{fill:var(--ink);font-family:Inter,ui-sans-serif,system-ui,sans-serif}.title{font-size:34px;font-weight:700}.label{font-size:27px;font-weight:700}.body{font-size:22px}.small{font-size:19px}.muted{fill:var(--muted)}.stage{fill:var(--panel);stroke:var(--line);stroke-width:2}.ret{fill:var(--ret-soft);stroke:var(--ret);stroke-width:3}.adv{fill:var(--adv-soft);stroke:var(--adv);stroke-width:3}.flow{fill:none;stroke:var(--ret);stroke-width:3;marker-end:url(#arrow)}.dash{stroke:var(--adv);stroke-dasharray:12 8}
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs>
  <rect width="800" height="1180" fill="var(--bg)"/><text class="title" x="400" y="54" text-anchor="middle">Source retrieval widens once, then freezes</text>
  <rect class="stage" x="55" y="95" width="300" height="110" rx="9"/><text class="label" x="205" y="142" text-anchor="middle">Untouched narrative</text><text class="body muted" x="205" y="180" text-anchor="middle">always one query lane</text>
  <rect class="adv" x="445" y="95" width="300" height="110" rx="9"/><text class="label" x="595" y="142" text-anchor="middle">DeepSeek planning</text><text class="body muted" x="595" y="180" text-anchor="middle">0–8 subnarratives • one shot</text>
  <path class="flow" d="M205 205V260H400" vector-effect="non-scaling-stroke"/><path class="flow dash" d="M595 205V260H400V290" vector-effect="non-scaling-stroke"/>
  <rect class="ret" x="100" y="300" width="600" height="115" rx="9"/><text class="label" x="400" y="348" text-anchor="middle">1–25 bounded BM25 query lanes</text><text class="body muted" x="400" y="386" text-anchor="middle">original + 1–3 queries per subnarrative</text>
  <path class="flow" d="M400 415V470" vector-effect="non-scaling-stroke"/>
  <rect class="stage" x="100" y="480" width="600" height="115" rx="9"/><text class="label" x="400" y="528" text-anchor="middle">Pyserini REST • climbmix-400b</text><text class="body muted" x="400" y="566" text-anchor="middle">≤1,000 internal documents per query</text>
  <path class="flow" d="M400 595V650" vector-effect="non-scaling-stroke"/>
  <rect class="ret" x="55" y="660" width="210" height="125" rx="9"/><text class="label" x="160" y="707" text-anchor="middle">Documents</text><text class="small muted" x="160" y="744" text-anchor="middle">full ClimbMix text</text>
  <rect class="ret" x="295" y="660" width="210" height="125" rx="9"/><text class="label" x="400" y="707" text-anchor="middle">Chunks</text><text class="small muted" x="400" y="744" text-anchor="middle">3500 chars • 350 overlap</text>
  <rect class="ret" x="535" y="660" width="210" height="125" rx="9"/><text class="label" x="640" y="707" text-anchor="middle">Passages</text><text class="small muted" x="640" y="744" text-anchor="middle">Mixedbread ranked</text>
  <path class="flow" d="M265 722H295M505 722H535" vector-effect="non-scaling-stroke"/>
  <path class="flow" d="M640 785V840H400V875" vector-effect="non-scaling-stroke"/>
  <rect class="ret" x="65" y="885" width="430" height="120" rx="9"/><text class="label" x="280" y="934" text-anchor="middle">Selected evidence</text><text class="body muted" x="280" y="974" text-anchor="middle">exact passages • factual authority</text>
  <rect class="adv" x="525" y="885" width="220" height="120" rx="9"/><text class="label" x="635" y="934" text-anchor="middle">Advisory hints</text><text class="small muted" x="635" y="974" text-anchor="middle">one-shot Nuggetizer</text>
  <path class="flow dash" d="M495 945H525" vector-effect="non-scaling-stroke"/><path class="flow" d="M280 1005V1060H400M635 1005V1060H400V1090" vector-effect="non-scaling-stroke"/>
  <rect class="stage" x="115" y="1095" width="570" height="65" rx="9"/><text class="label" x="400" y="1137" text-anchor="middle">Frozen authenticated source artifact</text>
</svg>
