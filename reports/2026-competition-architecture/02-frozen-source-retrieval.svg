  <rect class="bar" x="214.8" y="342.2" width="5" height="57.8" opacity="0.8"/>
  <rect class="bar" x="224.4" y="346.1" width="5" height="53.9" opacity="0.8"/>
  <rect class="bar" x="234.0" y="350.0" width="5" height="50.0" opacity="0.8"/>
  <rect class="bar" x="243.6" y="353.9" width="5" height="46.1" opacity="0.8"/>
  <rect class="bar" x="253.2" y="357.8" width="5" height="42.2" opacity="0.8"/>
  <rect class="bar" x="262.8" y="361.7" width="5" height="38.3" opacity="0.8"/>
  <text class="tiny" x="40" y="424">ranked by BM25</text>
  <path class="arrow" d="M286 330H322" vector-effect="non-scaling-stroke"/>
  <text class="tiny" x="304" y="316" text-anchor="middle">one of them</text>
  <text class="u" x="344" y="118">chunks</text>
  <text class="s" x="344" y="144">3,500 characters each</text>
  <text class="tiny" x="344" y="166">overlapping by 350 characters</text>
  <rect class="page" x="344" y="200" width="64" height="216" rx="5" vector-effect="non-scaling-stroke"/>
  <line class="sep" x1="354" y1="220" x2="398" y2="220" vector-effect="non-scaling-stroke"/>
  <line class="sep" x1="354" y1="244" x2="398" y2="244" vector-effect="non-scaling-stroke"/>
  <line class="sep" x1="354" y1="268" x2="398" y2="268" vector-effect="non-scaling-stroke"/>
  <line class="sep" x1="354" y1="292" x2="398" y2="292" vector-effect="non-scaling-stroke"/>
  <line class="sep" x1="354" y1="316" x2="398" y2="316" vector-effect="non-scaling-stroke"/>
  <line class="sep" x1="354" y1="340" x2="398" y2="340" vector-effect="non-scaling-stroke"/>
  <line class="sep" x1="354" y1="364" x2="398" y2="364" vector-effect="non-scaling-stroke"/>
  <line class="sep" x1="354" y1="388" x2="398" y2="388" vector-effect="non-scaling-stroke"/>
  <text class="tiny" x="376" y="440" text-anchor="middle">one document</text>
  <rect class="win" x="452" y="200" width="168" height="72" rx="6" vector-effect="non-scaling-stroke"/>
  <line class="tick" x1="408" y1="236.0" x2="452" y2="236.0" vector-effect="non-scaling-stroke"/>
  <rect class="win" x="452" y="248" width="168" height="72" rx="6" vector-effect="non-scaling-stroke"/>
  <line class="tick" x1="408" y1="284.0" x2="452" y2="284.0" vector-effect="non-scaling-stroke"/>
  <rect class="win" x="452" y="296" width="168" height="72" rx="6" vector-effect="non-scaling-stroke"/>
  <line class="tick" x1="408" y1="332.0" x2="452" y2="332.0" vector-effect="non-scaling-stroke"/>
  <rect class="win" x="452" y="344" width="168" height="72" rx="6" vector-effect="non-scaling-stroke"/>
  <line class="tick" x1="408" y1="380.0" x2="452" y2="380.0" vector-effect="non-scaling-stroke"/>
  <text class="tiny" x="536" y="464" text-anchor="middle">where two bands meet, the text is in both</text>
  <path class="arrow" d="M632 330H664" vector-effect="non-scaling-stroke"/>
  <text class="u" x="686" y="118">passages</text>
  <text class="s" x="686" y="144">≤ 100 kept per query</text>
  <text class="tiny" x="686" y="166">scored by mxbai-rerank-base-v2</text>
  <rect class="keep" x="686" y="200" width="86" height="34" rx="5" vector-effect="non-scaling-stroke"/>
  <text class="mono" x="784" y="223">0.81</text>
  <rect class="bar" x="832" y="211" width="74.5" height="12" rx="3"/>
  <rect class="keep" x="686" y="248" width="86" height="34" rx="5" vector-effect="non-scaling-stroke"/>
  <text class="mono" x="784" y="271">0.74</text>
  <rect class="bar" x="832" y="259" width="68.1" height="12" rx="3"/>
  <rect class="drop" x="686" y="296" width="86" height="34" rx="5" vector-effect="non-scaling-stroke"/>
  <text class="mono" x="784" y="319">0.22</text>
  <rect class="barout" x="832" y="307" width="20.2" height="12" rx="3" vector-effect="non-scaling-stroke"/>
  <text class="tiny" x="862.2" y="318">dropped</text>
  <rect class="drop" x="686" y="344" width="86" height="34" rx="5" vector-effect="non-scaling-stroke"/>
  <text class="mono" x="784" y="367">0.09</text>
  <rect class="barout" x="832" y="355" width="8.3" height="12" rx="3" vector-effect="non-scaling-stroke"/>
  <text class="tiny" x="850.3" y="366">dropped</text>
  <text class="tiny" x="686" y="440">the kept windows are the selected evidence</text>
  <rect class="hint" x="686" y="468" width="274" height="70" rx="10" vector-effect="non-scaling-stroke"/>
  <text class="s" x="706" y="496" fill="var(--adv)">one-shot Nuggetizer · advisory hints</text>
  <text class="tiny" x="706" y="520">suggest coverage · never citable</text>
  <line class="sep" x1="40" y1="468" x2="640" y2="468" vector-effect="non-scaling-stroke"/>
  <text class="s" x="40" y="498">Selected passages are factual authority.</text>
  <text class="tiny" x="40" y="524">Scores are illustrative; the ceilings are the configured ones.</text>
  <text class="tiny" x="40" y="548">All of it freezes together into the authenticated source artifact.</text>
</svg>
