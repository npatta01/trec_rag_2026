<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="src-title src-desc">
  <title id="src-title">A document becomes overlapping chunks, and chunks become scored passages</title>
  <desc id="src-desc">Three panels left to right, with the unit named above each. First, one BM25 query lane returns up to 1,000 documents from the climbmix-400b index, drawn as a field of bars falling by rank. Second, one of those documents is opened and cut into windows of 3,500 characters that overlap by 350 characters; the windows are drawn as translucent bands beside the document, and each overlap shows as a darker strip where two bands meet. Third, the mxbai-rerank-base-v2 cross-encoder scores each window against the query. The highest scoring windows are kept, at most 100 per query, and become the selected evidence that freezes; lower ones are dropped. A dashed amber card holds the one-shot Nuggetizer claim hints, which suggest coverage and are never citable.</desc>
  <style>
    :root{color-scheme:light dark;--bg:#f6f8f7;--panel:#fff;--ink:#13231c;--muted:#4b5d54;--line:#5e6d66;--hair:#cdd8d1;--ret:#087c72;--ret-soft:#d9f1ed;--gen:#5664c7;--gen-soft:#e6e9ff;--ok:#277a45;--ok-soft:#ddf2e3;--adv:#91610d;--adv-soft:#faecc7}
    @media (prefers-color-scheme: dark){:root{--bg:#0d1411;--panel:#17211c;--ink:#f0f6f2;--muted:#bac7bf;--line:#9cada3;--hair:#2f3b35;--ret:#69d8ca;--ret-soft:#183d38;--gen:#aab4ff;--gen-soft:#242b57;--ok:#82dda0;--ok-soft:#173c25;--adv:#f0c46f;--adv-soft:#433616}}
    text{fill:var(--ink);font-family:Inter,ui-sans-serif,system-ui,sans-serif}
    .h{font-size:25px;font-weight:700}
    .u{font-size:20px;font-weight:700}
    .s{font-size:16px;fill:var(--muted)}
    .tiny{font-size:14px;fill:var(--muted)}
    .mono{font-size:15px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;fill:var(--ink)}
    .page{fill:var(--panel);stroke:var(--line);stroke-width:2}
    .win{fill:var(--ret);fill-opacity:.18;stroke:var(--ret);stroke-width:2}
    .keep{fill:var(--ret-soft);stroke:var(--ret);stroke-width:3}
    .drop{fill:var(--panel);stroke:var(--hair);stroke-width:2}
    .bar{fill:var(--ret)}
    .barout{fill:none;stroke:var(--line);stroke-width:2}
    .hint{fill:var(--adv-soft);stroke:var(--adv);stroke-width:2;stroke-dasharray:6 4}
    .arrow{fill:none;stroke:var(--line);stroke-width:2.5;marker-end:url(#a)}
    .sep{stroke:var(--hair);stroke-width:2}
    .tick{stroke:var(--ret);stroke-width:1.5;opacity:.6}
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs>

  <rect width="1000" height="620" fill="var(--bg)"/>
  <text class="h" x="40" y="44">The unit changes twice before anything is selected</text>
  <text class="s" x="40" y="74">Every query lane crosses the same two ceilings, in the same order.</text>
  <text class="u" x="40" y="118">documents</text>
  <text class="s" x="40" y="144">≤ 1,000 per query</text>
  <text class="tiny" x="40" y="166">climbmix-400b, through Pyserini</text>
  <rect class="bar" x="42.0" y="272.0" width="5" height="128.0" opacity="0.8"/>
  <rect class="bar" x="51.6" y="275.9" width="5" height="124.1" opacity="0.8"/>
  <rect class="bar" x="61.2" y="279.8" width="5" height="120.2" opacity="0.8"/>
  <rect class="bar" x="70.8" y="283.7" width="5" height="116.3" opacity="0.8"/>
  <rect class="bar" x="80.4" y="287.6" width="5" height="112.4" opacity="0.8"/>
  <rect class="bar" x="90.0" y="291.5" width="5" height="108.5" opacity="0.8"/>
