  <rect class="bar" x="138.0" y="311.0" width="5" height="89.0" opacity="0.8"/>
  <rect class="bar" x="147.6" y="314.9" width="5" height="85.1" opacity="0.8"/>
  <rect class="bar" x="157.2" y="318.8" width="5" height="81.2" opacity="0.8"/>
  <rect class="bar" x="166.8" y="322.7" width="5" height="77.3" opacity="0.8"/>
  <rect class="bar" x="176.4" y="326.6" width="5" height="73.4" opacity="0.8"/>
  <rect class="bar" x="186.0" y="330.5" width="5" height="69.5" opacity="0.8"/>
