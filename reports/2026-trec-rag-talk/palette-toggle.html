
<div id="deck-controls">
  <button id="theme-toggle" type="button" data-state="auto">
    <span class="dot" aria-hidden="true"></span><span id="theme-name">Auto</span>
  </button>
  <button id="palette-toggle" type="button">
    <span class="swatch" aria-hidden="true"></span><span id="palette-name">Slate</span>
  </button>
</div>
<script>
(function () {
  // Two independent choices, both remembered: light/dark, and which palette.
  // "Auto" follows the system; Light and Dark pin it, because the machine a
  // talk is given on is often not the one it was written on.
  var THEMES = ["auto", "dark", "light"];
  var THEME_LABEL = { auto: "Auto", dark: "Dark", light: "Light" };
  var PALETTES = ["slate", "forest"];
  var PALETTE_LABEL = { slate: "Slate", forest: "Forest" };
  var THEME_KEY = "trec-talk-theme";
  var PALETTE_KEY = "trec-talk-palette";

  var root = document.documentElement;
  var themeButton = document.getElementById("theme-toggle");
  var themeName = document.getElementById("theme-name");
  var paletteButton = document.getElementById("palette-toggle");
  var paletteName = document.getElementById("palette-name");

  function save(key, value) {
    try { localStorage.setItem(key, value); } catch (err) { /* private window */ }
  }

  function load(key, allowed) {
    var value = null;
    try { value = localStorage.getItem(key); } catch (err) { value = null; }
    return allowed.indexOf(value) >= 0 ? value : allowed[0];
  }

  function applyTheme(value) {
    if (value === "auto") {
      root.removeAttribute("data-theme");
    } else {
      root.setAttribute("data-theme", value);
    }
    themeButton.setAttribute("data-state", value);
    themeName.textContent = THEME_LABEL[value];
    themeButton.setAttribute(
      "aria-label",
      "Brightness: " + THEME_LABEL[value] + (value === "auto" ? " (follows your system)" : "") + ". Click to change."
    );
    save(THEME_KEY, value);
  }

  function applyPalette(value) {
    root.setAttribute("data-palette", value);
    paletteName.textContent = PALETTE_LABEL[value];
    paletteButton.setAttribute("aria-label", "Colour palette: " + PALETTE_LABEL[value] + ". Click to change.");
    save(PALETTE_KEY, value);
  }

  var theme = load(THEME_KEY, THEMES);
  applyTheme(theme);
  applyPalette(load(PALETTE_KEY, PALETTES));

  function cycle(list, current) {
    return list[(list.indexOf(current) + 1) % list.length];
  }

  themeButton.addEventListener("click", function () {
    applyTheme(cycle(THEMES, themeButton.getAttribute("data-state")));
  });

  paletteButton.addEventListener("click", function () {
    applyPalette(cycle(PALETTES, root.getAttribute("data-palette")));
  });

  // "d" for brightness, "p" for palette — but not over Reveal's own overlays,
  // and not while something is being typed into.
  document.addEventListener("keydown", function (event) {
    if (event.metaKey || event.ctrlKey || event.altKey) { return; }
    var target = event.target;
    if (target && /^(INPUT|TEXTAREA|SELECT)$/.test(target.tagName)) { return; }
    if (document.querySelector(".reveal.overview, .slide-menu-wrapper.active")) { return; }
    if (event.key === "d") { themeButton.click(); }
    if (event.key === "p") { paletteButton.click(); }
  });
})();
</script>
