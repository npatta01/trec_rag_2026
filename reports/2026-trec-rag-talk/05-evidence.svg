<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 580" role="img" aria-labelledby="ev-title ev-desc">
  <title id="ev-title">Near-duplicate passages collapse to one survivor each, then produce hint claims the answer may use but never cites</title>
  <desc id="ev-desc">Nine retrieved passages are drawn as cards. Cards that say the same thing carry the same line pattern, and brackets mark the three sets of near-duplicates. An all-MiniLM-L6-v2 embedding treats any pair above cosine 0.92 as the same thing said twice, so each set collapses to a single survivor in its original wording, and maximal marginal relevance with lambda 0.7 picks each next survivor for being relevant and unlike the ones already kept apart. Nine passages become five selected passages, capped at forty per subnarrative. These are the authority the answer must cite. They are passed separately to a nugget generator returning up to twenty short claims, drawn in amber with a dashed edge because the answer may use them but must cite the passage, never the claim.</desc>
  <style>
    :root{color-scheme:light dark;--bg:#f6f8f7;--panel:#fff;--ink:#13231c;--muted:#4b5d54;--line:#5e6d66;--ret:#087c72;--ret-soft:#d9f1ed;--gen:#5664c7;--gen-soft:#e6e9ff;--ok:#277a45;--ok-soft:#ddf2e3;--adv:#91610d;--adv-soft:#faecc7}
    @media (prefers-color-scheme: dark){:root{--bg:#0d1411;--panel:#17211c;--ink:#f0f6f2;--muted:#bac7bf;--line:#9cada3;--ret:#69d8ca;--ret-soft:#183d38;--gen:#aab4ff;--gen-soft:#242b57;--ok:#82dda0;--ok-soft:#173c25;--adv:#f0c46f;--adv-soft:#433616}}
    text{fill:var(--ink);font-family:Inter,ui-sans-serif,system-ui,sans-serif}
    .ev-hd{font-size:33px;font-weight:760}
    .ev-role{font-size:23px;font-weight:800;letter-spacing:.07em}
    .ev-sm{font-size:24px;fill:var(--muted)}
    .ev-tiny{font-size:23px;fill:var(--muted)}
    .ev-mech{font-size:23px;font-weight:700;fill:var(--ret)}
    .ev-mechsm{font-size:23px;fill:var(--ret)}
    .ev-eq{font-size:30px;font-weight:800;fill:var(--ret)}
    .ev-flow{fill:none;stroke:var(--line);stroke-width:3;marker-end:url(#evar)}
    .ev-brk{fill:none;stroke:var(--ret);stroke-width:3}
  </style>
  <defs>
    <marker id="evar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker>
  </defs>
  <rect width="1500" height="580" fill="var(--bg)"/>

  <!-- A. retrieved passages, duplicates sharing a line pattern -->
  <text class="ev-hd" x="30" y="46">Retrieved passages</text>
  <text class="ev-sm" x="30" y="76">same pattern = same thing said twice</text>

  <g fill="var(--panel)" stroke="var(--line)" stroke-width="2.5">
    <rect x="70" y="100" width="200" height="40" rx="7"/>
    <rect x="70" y="150" width="200" height="40" rx="7"/>
    <rect x="70" y="200" width="200" height="40" rx="7"/>
    <rect x="70" y="250" width="200" height="40" rx="7"/>
    <rect x="70" y="300" width="200" height="40" rx="7"/>
    <rect x="70" y="350" width="200" height="40" rx="7"/>
    <rect x="70" y="400" width="200" height="40" rx="7"/>
    <rect x="70" y="450" width="200" height="40" rx="7"/>
    <rect x="70" y="500" width="200" height="40" rx="7"/>
  </g>
  <!-- line patterns: A A A | B B | single | C C | single -->
  <g fill="var(--line)" opacity=".55">
    <rect x="84" y="112" width="142" height="5" rx="2.5"/><rect x="84" y="126" width="92"  height="5" rx="2.5"/>
    <rect x="84" y="162" width="142" height="5" rx="2.5"/><rect x="84" y="176" width="92"  height="5" rx="2.5"/>
    <rect x="84" y="212" width="142" height="5" rx="2.5"/><rect x="84" y="226" width="92"  height="5" rx="2.5"/>
    <rect x="84" y="262" width="100" height="5" rx="2.5"/><rect x="84" y="276" width="134" height="5" rx="2.5"/>
    <rect x="84" y="312" width="100" height="5" rx="2.5"/><rect x="84" y="326" width="134" height="5" rx="2.5"/>
    <rect x="84" y="362" width="118" height="5" rx="2.5"/><rect x="84" y="376" width="118" height="5" rx="2.5"/>
    <rect x="84" y="412" width="158" height="5" rx="2.5"/><rect x="84" y="426" width="70"  height="5" rx="2.5"/>
    <rect x="84" y="462" width="158" height="5" rx="2.5"/><rect x="84" y="476" width="70"  height="5" rx="2.5"/>
    <rect x="84" y="512" width="84"  height="5" rx="2.5"/><rect x="84" y="526" width="150" height="5" rx="2.5"/>
  </g>
  <!-- brackets over each duplicate set -->
  <path class="ev-brk" d="M64 100 H56 V240 H64"/>
  <text class="ev-eq" x="30" y="180">=</text>
  <path class="ev-brk" d="M64 250 H56 V340 H64"/>
  <text class="ev-eq" x="30" y="305">=</text>
  <path class="ev-brk" d="M64 400 H56 V490 H64"/>
  <text class="ev-eq" x="30" y="455">=</text>

  <!-- B. the mechanism, stacked narrow to clear both columns -->
  <text class="ev-mech"   x="386" y="250" text-anchor="middle">all-MiniLM-L6-v2</text>
  <text class="ev-mechsm" x="386" y="278" text-anchor="middle">cosine ≥ 0.92</text>
  <path class="ev-flow" d="M282 312 H478"/>

  <!-- C. selected evidence: one survivor per set, patterns preserved -->
  <rect x="500" y="76" width="450" height="464" rx="14" fill="var(--ret-soft)" stroke="var(--ret)" stroke-width="3.5"/>
  <text class="ev-role" x="524" y="116" style="fill:var(--ret)">THE AUTHORITY</text>
  <text class="ev-hd"   x="524" y="158">Selected evidence</text>
  <g fill="var(--panel)" stroke="var(--ret)" stroke-width="2.5">
    <rect x="524" y="190" width="402" height="44" rx="7"/>
    <rect x="524" y="242" width="402" height="44" rx="7"/>
    <rect x="524" y="294" width="402" height="44" rx="7"/>
    <rect x="524" y="346" width="402" height="44" rx="7"/>
    <rect x="524" y="398" width="402" height="44" rx="7"/>
  </g>
  <g fill="var(--ret)" opacity=".6">
    <rect x="540" y="203" width="142" height="5" rx="2.5"/><rect x="540" y="218" width="92"  height="5" rx="2.5"/>
    <rect x="540" y="255" width="100" height="5" rx="2.5"/><rect x="540" y="270" width="134" height="5" rx="2.5"/>
    <rect x="540" y="307" width="118" height="5" rx="2.5"/><rect x="540" y="322" width="118" height="5" rx="2.5"/>
    <rect x="540" y="359" width="158" height="5" rx="2.5"/><rect x="540" y="374" width="70"  height="5" rx="2.5"/>
    <rect x="540" y="411" width="84"  height="5" rx="2.5"/><rect x="540" y="426" width="150" height="5" rx="2.5"/>
  </g>
  <text class="ev-sm"   x="524" y="480">nine passages, five survive</text>
  <text class="ev-tiny" x="524" y="514">≤40 selected per subnarrative</text>

  <path class="ev-flow" d="M962 312 H1002" stroke="var(--adv)" stroke-dasharray="8 6"/>

  <!-- D. hint claims: dashed, never cited -->
  <rect x="1010" y="76" width="460" height="464" rx="14" fill="var(--adv-soft)" stroke="var(--adv)" stroke-width="3.5" stroke-dasharray="9 7"/>
  <text class="ev-role" x="1034" y="116" style="fill:var(--adv)">HINTS — NEVER CITED</text>
  <text class="ev-hd"   x="1034" y="158">Generated nuggets</text>
  <g fill="none" stroke="var(--adv)" stroke-width="2.5" stroke-dasharray="6 5">
    <rect x="1034" y="190" width="412" height="44" rx="7"/>
    <rect x="1034" y="242" width="412" height="44" rx="7"/>
    <rect x="1034" y="294" width="412" height="44" rx="7"/>
    <rect x="1034" y="346" width="412" height="44" rx="7"/>
  </g>
  <text class="ev-sm"   x="1034" y="480">≤20 short claims</text>
  <text class="ev-tiny" x="1034" y="514">cite the passage, never these</text>
</svg>
