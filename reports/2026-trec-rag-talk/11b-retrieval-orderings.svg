<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" role="img" aria-labelledby="ro-title ro-desc">
  <title id="ro-title">One candidate core, submitted three times in three different orders</title>
  <desc id="ro-desc">Three boxes side by side, one per submitted run, each carrying a priority badge. The first, priority one, is narrative plus subnarrative: it sorts by half the narrative percentile plus half the facet score. The second, priority two, is evidence breadth: it sorts by how many subnarratives a document supports, then by its strong passages. The third, priority three, is narrative only: it sorts by narrative percentile, then rank, then document id. Inside each box the same four documents appear as lettered chips, A B C and D, in a different order in each box, because the set never changes and only the order does. A band at the foot states that for a given narrative all three runs contain the identical document set, checked by hashing every topic and document pair across the three submitted files.</desc>
  <style>
    :root{color-scheme:light dark;--bg:#f6f8f7;--panel:#fff;--ink:#13231c;--muted:#4b5d54;--line:#5e6d66;--ret:#087c72;--ret-soft:#d9f1ed;--ok:#277a45;--ok-soft:#ddf2e3}
    @media (prefers-color-scheme: dark){:root{--bg:#0d1411;--panel:#17211c;--ink:#f0f6f2;--muted:#bac7bf;--line:#9cada3;--ret:#69d8ca;--ret-soft:#183d38;--ok:#82dda0;--ok-soft:#173c25}}
    text{fill:var(--ink);font-family:Inter,ui-sans-serif,system-ui,sans-serif}
    .ro-kick{font-size:23px;font-weight:800;letter-spacing:.05em;fill:var(--muted)}
    .ro-hd{font-size:30px;font-weight:780}
    .ro-key{font-size:19px;fill:var(--muted);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    .ro-pri{font-size:19px;font-weight:800;letter-spacing:.05em}
    .ro-doc{font-size:24px;font-weight:800;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    .ro-note{font-size:22px}
    .ro-sub{font-size:19px;fill:var(--muted)}
  </style>
  <rect width="1600" height="560" fill="var(--bg)"/>

  <text class="ro-kick" x="40" y="42">ONE CANDIDATE CORE · ORDERED THREE WAYS · THREE SUBMITTED FILES</text>

  <!-- box 1 -->
  <rect x="40" y="66" width="490" height="340" rx="14" fill="var(--panel)" stroke="var(--ret)" stroke-width="3.5"/>
  <rect x="368" y="88" width="140" height="34" rx="17" fill="var(--ret-soft)" stroke="var(--ret)" stroke-width="2"/>
  <text class="ro-pri" x="438" y="112" text-anchor="middle" style="fill:var(--ret)">PRIORITY 1</text>
  <text class="ro-hd"  x="66" y="118">Narrative</text>
  <text class="ro-hd"  x="66" y="152">+ subnarrative</text>
  <text class="ro-key" x="66" y="184">0.5 × narrative pct</text>
  <text class="ro-key" x="66" y="208">+ 0.5 × facet score</text>
  <g>
    <rect x="66" y="234" width="438" height="36" rx="8" fill="var(--ret-soft)" stroke="var(--ret)" stroke-width="2"/><text class="ro-doc" x="88" y="260">D</text>
    <rect x="66" y="276" width="438" height="36" rx="8" fill="var(--ret-soft)" stroke="var(--ret)" stroke-width="2"/><text class="ro-doc" x="88" y="302">A</text>
    <rect x="66" y="318" width="438" height="36" rx="8" fill="var(--ret-soft)" stroke="var(--ret)" stroke-width="2"/><text class="ro-doc" x="88" y="344">C</text>
    <rect x="66" y="360" width="438" height="36" rx="8" fill="var(--ret-soft)" stroke="var(--ret)" stroke-width="2"/><text class="ro-doc" x="88" y="386">B</text>
  </g>

  <!-- box 2 -->
  <rect x="555" y="66" width="490" height="340" rx="14" fill="var(--panel)" stroke="var(--ret)" stroke-width="3"/>
  <rect x="883" y="88" width="140" height="34" rx="17" fill="var(--ret-soft)" stroke="var(--ret)" stroke-width="2"/>
  <text class="ro-pri" x="953" y="112" text-anchor="middle" style="fill:var(--ret)">PRIORITY 2</text>
  <text class="ro-hd"  x="581" y="118">Evidence</text>
  <text class="ro-hd"  x="581" y="152">breadth</text>
  <text class="ro-key" x="581" y="184">subnarratives supported,</text>
  <text class="ro-key" x="581" y="208">then strong passages</text>
  <g>
    <rect x="581" y="234" width="438" height="36" rx="8" fill="var(--ret-soft)" stroke="var(--ret)" stroke-width="2"/><text class="ro-doc" x="603" y="260">A</text>
    <rect x="581" y="276" width="438" height="36" rx="8" fill="var(--ret-soft)" stroke="var(--ret)" stroke-width="2"/><text class="ro-doc" x="603" y="302">D</text>
    <rect x="581" y="318" width="438" height="36" rx="8" fill="var(--ret-soft)" stroke="var(--ret)" stroke-width="2"/><text class="ro-doc" x="603" y="344">B</text>
    <rect x="581" y="360" width="438" height="36" rx="8" fill="var(--ret-soft)" stroke="var(--ret)" stroke-width="2"/><text class="ro-doc" x="603" y="386">C</text>
  </g>

  <!-- box 3 -->
  <rect x="1070" y="66" width="490" height="340" rx="14" fill="var(--panel)" stroke="var(--ret)" stroke-width="3"/>
  <rect x="1398" y="88" width="140" height="34" rx="17" fill="var(--ret-soft)" stroke="var(--ret)" stroke-width="2"/>
  <text class="ro-pri" x="1468" y="112" text-anchor="middle" style="fill:var(--ret)">PRIORITY 3</text>
  <text class="ro-hd"  x="1096" y="118">Narrative</text>
  <text class="ro-hd"  x="1096" y="152">only</text>
  <text class="ro-key" x="1096" y="184">narrative percentile,</text>
  <text class="ro-key" x="1096" y="208">then rank, then docid</text>
  <g>
    <rect x="1096" y="234" width="438" height="36" rx="8" fill="var(--ret-soft)" stroke="var(--ret)" stroke-width="2"/><text class="ro-doc" x="1118" y="260">C</text>
    <rect x="1096" y="276" width="438" height="36" rx="8" fill="var(--ret-soft)" stroke="var(--ret)" stroke-width="2"/><text class="ro-doc" x="1118" y="302">A</text>
    <rect x="1096" y="318" width="438" height="36" rx="8" fill="var(--ret-soft)" stroke="var(--ret)" stroke-width="2"/><text class="ro-doc" x="1118" y="344">D</text>
    <rect x="1096" y="360" width="438" height="36" rx="8" fill="var(--ret-soft)" stroke="var(--ret)" stroke-width="2"/><text class="ro-doc" x="1118" y="386">B</text>
  </g>

  <text class="ro-sub" x="800" y="434" text-anchor="middle">same four documents in all three boxes — only their order changes</text>

  <rect x="40" y="448" width="1520" height="104" rx="12" fill="var(--ok-soft)" stroke="var(--ok)" stroke-width="3"/>
  <text class="ro-note" x="66" y="480" style="font-weight:800;fill:var(--ok)">WHAT IS HELD CONSTANT</text>
  <text class="ro-note" x="66" y="510">For a narrative the three runs hold the <tspan font-weight="800">identical document set</tspan> — only the order differs.</text>
  <text class="ro-note" x="66" y="538">So all three scored the same per topic: the Retrieval numbers measure what the cutoff selected, not how it was ordered.</text>
</svg>
