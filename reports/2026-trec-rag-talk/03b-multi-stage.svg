<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" role="img" aria-labelledby="ms-title ms-desc">
  <title id="ms-title">Multi-stage: the work changes hands seven times</title>
  <desc id="ms-desc">A three-lane strip. Time runs left to right and the lane says who did it: Luna the reviewer, marked with a crescent moon; Sol the writer, marked with a sun; and local code, marked with angle brackets and a dashed outline. The path zigzags between the lanes seven times. One, Luna plans the answer. Two, Sol writes the draft. Three, Luna audits each evidence group on its own, returning at most six missing-detail cards per group. Four, local code merges those cards. Five, Sol proposes edits, at most three. Six, Luna screens each proposed edit against five booleans that must all pass. Seven, local code applies only the edits that passed. The result is 119 validated answers. This is one pass through the stages, not a repeating loop, and if revision fails the draft that already passed validation stands.</desc>
  <style>
    :root{color-scheme:light dark;--bg:#f6f8f7;--panel:#fff;--ink:#13231c;--muted:#4b5d54;--line:#5e6d66;--ret:#087c72;--ret-soft:#d9f1ed;--gen:#5664c7;--gen-soft:#e6e9ff;--ok:#277a45;--ok-soft:#ddf2e3}
    @media (prefers-color-scheme: dark){:root{--bg:#0d1411;--panel:#17211c;--ink:#f0f6f2;--muted:#bac7bf;--line:#9cada3;--ret:#69d8ca;--ret-soft:#183d38;--gen:#aab4ff;--gen-soft:#242b57;--ok:#82dda0;--ok-soft:#173c25}}
    text{fill:var(--ink);font-family:Inter,ui-sans-serif,system-ui,sans-serif}
    .ms-who{font-size:25px;font-weight:780}
    .ms-model{font-size:13px;fill:var(--muted);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    .ms-label{font-size:21px;font-weight:700}
    .ms-sub{font-size:17px;fill:var(--muted)}
    .ms-step{font-size:18px;font-weight:800}
    .ms-flow{fill:none;stroke:var(--line);stroke-width:2.8;marker-end:url(#msa)}
    .ms-lane{fill:var(--panel);opacity:.45}
    .ms-ico{fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  </style>
  <defs>
    <marker id="msa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker>
    <g id="ms-g-sun" class="ms-ico"><circle cx="0" cy="0" r="4.8"/><path d="M0 -11.5V-8.4M0 8.4V11.5M-11.5 0H-8.4M8.4 0H11.5M-8.1 -8.1L-5.9 -5.9M5.9 5.9L8.1 8.1M8.1 -8.1L5.9 -5.9M-5.9 5.9L-8.1 8.1"/></g>
    <g id="ms-g-moon" class="ms-ico"><path d="M9 0.9A9.8 9.8 0 1 1 -0.9 -9A7.6 7.6 0 0 0 9 0.9Z"/></g>
    <g id="ms-g-code" class="ms-ico"><path d="M-4 -8L-11 0L-4 8M4 -8L11 0L4 8"/></g>
  </defs>
  <rect width="1600" height="600" fill="var(--bg)"/>

  <rect class="ms-lane" x="292" y="110" width="1268" height="120" rx="10"/>
  <rect class="ms-lane" x="292" y="250" width="1268" height="120" rx="10"/>
  <rect class="ms-lane" x="292" y="390" width="1268" height="106" rx="10"/>

  <g transform="translate(86,170)" style="color:var(--gen)"><circle r="23" fill="var(--gen-soft)" stroke="var(--gen)" stroke-width="2.6"/><use href="#ms-g-moon"/></g>
  <text class="ms-who"   x="120" y="166" style="fill:var(--gen)">Luna</text>
  <text class="ms-model" x="120" y="190">openai/gpt-5.6-luna</text>
  <text class="ms-sub"   x="120" y="214">judges, never writes</text>

  <g transform="translate(86,310)" style="color:var(--ret)"><circle r="23" fill="var(--ret-soft)" stroke="var(--ret)" stroke-width="2.6"/><use href="#ms-g-sun"/></g>
  <text class="ms-who"   x="120" y="306" style="fill:var(--ret)">Sol</text>
  <text class="ms-model" x="120" y="330">openai/gpt-5.6-sol</text>
  <text class="ms-sub"   x="120" y="354">writes, never judges</text>

  <g transform="translate(86,443)" style="color:var(--line)"><circle r="23" fill="none" stroke="var(--line)" stroke-width="2.4" stroke-dasharray="5 5"/><use href="#ms-g-code"/></g>
  <text class="ms-who"   x="120" y="439" style="fill:var(--muted)" font-size="23">local code</text>
  <text class="ms-model" x="120" y="463">no model</text>

  <path class="ms-flow" d="M300 60 H370 V126"/>
  <text class="ms-sub" x="300" y="52">the same sealed evidence handoff</text>

  <!-- 1 Luna plans -->
  <rect x="280" y="134" width="186" height="80" rx="10" fill="var(--gen-soft)" stroke="var(--gen)" stroke-width="2.6"/>
  <text class="ms-step"  x="294" y="156" style="fill:var(--gen)">1</text>
  <text class="ms-label" x="373" y="180" text-anchor="middle">Plans</text>
  <text class="ms-sub"   x="373" y="202" text-anchor="middle">3–8 obligations</text>
  <path class="ms-flow" d="M466 174 H476 V310 H483"/>

  <!-- 2 Sol drafts -->
  <rect x="487" y="274" width="186" height="80" rx="10" fill="var(--ret-soft)" stroke="var(--ret)" stroke-width="2.6"/>
  <text class="ms-step"  x="501" y="296" style="fill:var(--ret)">2</text>
  <text class="ms-label" x="580" y="320" text-anchor="middle">Drafts</text>
  <text class="ms-sub"   x="580" y="342" text-anchor="middle">the whole answer</text>
  <path class="ms-flow" d="M673 314 H683 V174 H690"/>

  <!-- 3 Luna audits -->
  <rect x="694" y="134" width="186" height="80" rx="10" fill="var(--gen-soft)" stroke="var(--gen)" stroke-width="2.6"/>
  <text class="ms-step"  x="708" y="156" style="fill:var(--gen)">3</text>
  <text class="ms-label" x="787" y="180" text-anchor="middle">Audits</text>
  <text class="ms-sub"   x="787" y="202" text-anchor="middle">≤6 cards per group</text>
  <path class="ms-flow" d="M880 174 H890 V443 H897"/>

  <rect x="901" y="414" width="110" height="60" rx="10" fill="none" stroke="var(--line)" stroke-width="2.4" stroke-dasharray="5 5"/>
  <text class="ms-sub" x="956" y="438" text-anchor="middle">merges</text>
  <text class="ms-sub" x="956" y="458" text-anchor="middle">the cards</text>
  <path class="ms-flow" d="M1011 443 H1021 V314 H1028"/>

  <!-- 4 Sol proposes -->
  <rect x="1032" y="274" width="186" height="80" rx="10" fill="var(--ret-soft)" stroke="var(--ret)" stroke-width="2.6"/>
  <text class="ms-step"  x="1046" y="296" style="fill:var(--ret)">4</text>
  <text class="ms-label" x="1125" y="320" text-anchor="middle">Proposes</text>
  <text class="ms-sub"   x="1125" y="342" text-anchor="middle">at most 3 edits</text>
  <path class="ms-flow" d="M1218 314 H1228 V174 H1235"/>

  <!-- 5 Luna screens -->
  <rect x="1239" y="134" width="186" height="80" rx="10" fill="var(--gen-soft)" stroke="var(--gen)" stroke-width="2.6"/>
  <text class="ms-step"  x="1253" y="156" style="fill:var(--gen)">5</text>
  <text class="ms-label" x="1332" y="180" text-anchor="middle">Screens</text>
  <text class="ms-sub"   x="1332" y="202" text-anchor="middle">all five must pass</text>
  <path class="ms-flow" d="M1425 174 H1435 V443 H1442"/>

  <rect x="1446" y="414" width="110" height="60" rx="10" fill="none" stroke="var(--line)" stroke-width="2.4" stroke-dasharray="5 5"/>
  <text class="ms-sub" x="1501" y="438" text-anchor="middle">applies only</text>
  <text class="ms-sub" x="1501" y="458" text-anchor="middle">what passed</text>
  <path class="ms-flow" d="M1501 474 V512"/>

  <rect x="280" y="516" width="1280" height="62" rx="10" fill="var(--ok-soft)" stroke="var(--ok)" stroke-width="2.6"/>
  <text class="ms-label" x="920" y="544" text-anchor="middle">119 validated answers · one pass through the stages, not a repeating loop</text>
  <text class="ms-sub"   x="920" y="568" text-anchor="middle">if revision fails, the draft that already passed validation stands — the extra stages can only add</text>
</svg>
