<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" role="img" aria-labelledby="tw-title tw-desc">
  <title id="tw-title">Single-pass is Sol alone; multi-stage passes the work between Luna and Sol</title>
  <desc id="tw-desc">Two swimlane strips, both fed by the same sealed evidence handoff, and neither writer searches again. Time runs left to right; the lane a box sits in says who did it. Sol the writer is marked with a sun, Luna the reviewer with a crescent moon, and local code with angle brackets. The first strip, single-pass, is two steps wide: Sol writes the answer, local code checks schema, citations and word limit, with one retry allowed back to Sol, which was used on two of the one hundred and nineteen requests. The second strip, multi-stage, is seven steps wide and the path zigzags between the lanes: Luna plans the answer, Sol writes the draft, Luna audits each evidence group and returns at most six missing-detail cards per group, local code merges those cards, Sol proposes edits, Luna screens each edit against five booleans that must all pass, and local code applies only the edits that passed. One pass through the stages, not a repeating loop; if revision fails the already validated draft stands.</desc>
  <style>
    :root{color-scheme:light dark;--bg:#f6f8f7;--panel:#fff;--ink:#13231c;--muted:#4b5d54;--line:#5e6d66;--ret:#087c72;--ret-soft:#d9f1ed;--gen:#5664c7;--gen-soft:#e6e9ff;--ok:#277a45;--ok-soft:#ddf2e3;--adv:#91610d;--adv-soft:#faecc7}
    @media (prefers-color-scheme: dark){:root{--bg:#0d1411;--panel:#17211c;--ink:#f0f6f2;--muted:#bac7bf;--line:#9cada3;--ret:#69d8ca;--ret-soft:#183d38;--gen:#aab4ff;--gen-soft:#242b57;--ok:#82dda0;--ok-soft:#173c25;--adv:#f0c46f;--adv-soft:#433616}}
    text{fill:var(--ink);font-family:Inter,ui-sans-serif,system-ui,sans-serif}
    .tw-kick{font-size:21px;font-weight:800;letter-spacing:.06em}
    .tw-head{font-size:26px;font-weight:760}
    .tw-who{font-size:25px;font-weight:780}
    .tw-model{font-size:15px;fill:var(--muted);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    .tw-label{font-size:19px;font-weight:680}
    .tw-sub{font-size:16px;fill:var(--muted)}
    .tw-step{font-size:17px;font-weight:800}
    .tw-chip{font-size:17px;font-weight:700;fill:var(--adv)}
    .tw-num{font-size:16px;font-weight:800}
    .tw-flow{fill:none;stroke:var(--line);stroke-width:2.6;marker-end:url(#twa)}
    .tw-back{fill:none;stroke:var(--adv);stroke-width:2.6;stroke-dasharray:8 6;marker-end:url(#twb)}
    .tw-sol{fill:var(--ret-soft);stroke:var(--ret);stroke-width:2.6}
    .tw-luna{fill:var(--gen-soft);stroke:var(--gen);stroke-width:2.6}
    .tw-loc{fill:none;stroke:var(--line);stroke-width:2.2;stroke-dasharray:5 5}
    .tw-lane{fill:var(--panel);opacity:.45}
    .tw-ico{fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  </style>
  <defs>
    <marker id="twa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker>
    <marker id="twb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker>
    <!-- Sol is the sun, Luna the moon. The names say so; the marks make it stick. -->
    <g id="tw-g-sun" class="tw-ico"><circle cx="0" cy="0" r="4.8"/><path d="M0 -11.5V-8.4M0 8.4V11.5M-11.5 0H-8.4M8.4 0H11.5M-8.1 -8.1L-5.9 -5.9M5.9 5.9L8.1 8.1M8.1 -8.1L5.9 -5.9M-5.9 5.9L-8.1 8.1"/></g>
    <g id="tw-g-moon" class="tw-ico"><path d="M9 0.9A9.8 9.8 0 1 1 -0.9 -9A7.6 7.6 0 0 0 9 0.9Z"/></g>
    <g id="tw-g-code" class="tw-ico"><path d="M-4 -8L-11 0L-4 8M4 -8L11 0L4 8"/></g>
  </defs>
  <rect width="1600" height="700" fill="var(--bg)"/>

  <!-- the shared, sealed input -->
  <rect x="272" y="16" width="1280" height="68" rx="10" fill="var(--adv-soft)" stroke="var(--adv)" stroke-width="2.6"/>
  <text class="tw-head" x="912" y="46" text-anchor="middle">One sealed evidence handoff</text>
  <text class="tw-sub"  x="912" y="72" text-anchor="middle">exact passages · advisory nuggets · allowed citation IDs — neither writer searches again</text>

  <!-- ===================== strip 1: single-pass ===================== -->
  <text class="tw-kick" x="40" y="110" style="fill:var(--ret)">SINGLE-PASS · TWO STEPS</text>

  <rect class="tw-lane" x="272" y="130" width="1030" height="80" rx="10"/>
  <rect class="tw-lane" x="272" y="220" width="1030" height="72" rx="10"/>

  <g transform="translate(72,170)" style="color:var(--ret)"><circle r="20" fill="var(--ret-soft)" stroke="var(--ret)" stroke-width="2.4"/><use href="#tw-g-sun"/></g>
  <text class="tw-who"   x="102" y="166" style="fill:var(--ret)">Sol</text>
  <text class="tw-model" x="52" y="201">openai/gpt-5.6-sol</text>

  <g transform="translate(72,256)" style="color:var(--line)"><circle r="20" fill="none" stroke="var(--line)" stroke-width="2.2" stroke-dasharray="5 5"/><use href="#tw-g-code"/></g>
  <text class="tw-who"   x="102" y="252" style="fill:var(--muted)" font-size="21">local code</text>
  <text class="tw-model" x="52" y="284">no model</text>

  <path class="tw-flow" d="M360 84 V134"/>

  <rect class="tw-sol" x="272" y="138" width="176" height="64" rx="9"/>
  <text class="tw-label" x="360" y="176" text-anchor="middle">Writes the answer</text>

  <path class="tw-flow" d="M448 170 H463 V256 H474"/>

  <rect class="tw-loc" x="478" y="228" width="240" height="56" rx="9"/>
  <text class="tw-label" x="598" y="251" text-anchor="middle">Checks it</text>
  <text class="tw-sub"   x="598" y="272" text-anchor="middle">schema · citations · word limit</text>

  <path class="tw-back" d="M598 228 V214 H360 V206"/>
  <text class="tw-chip" x="474" y="200">one retry — used on 2 of 119</text>

  <path class="tw-flow" d="M718 256 H740"/>
  <rect x="744" y="228" width="546" height="56" rx="9" fill="var(--ok-soft)" stroke="var(--ok)" stroke-width="2.6"/>
  <text class="tw-label" x="1017" y="261" text-anchor="middle">119 validated answers · one model call, two if the retry fired</text>

  <!-- ===================== strip 2: multi-stage ===================== -->
  <text class="tw-kick" x="40" y="326" style="fill:var(--gen)">MULTI-STAGE · THE WORK CHANGES HANDS FIVE TIMES</text>

  <rect class="tw-lane" x="272" y="346" width="1280" height="80" rx="10"/>
  <rect class="tw-lane" x="272" y="436" width="1280" height="80" rx="10"/>
  <rect class="tw-lane" x="272" y="526" width="1280" height="66" rx="10"/>

  <g transform="translate(72,386)" style="color:var(--gen)"><circle r="20" fill="var(--gen-soft)" stroke="var(--gen)" stroke-width="2.4"/><use href="#tw-g-moon"/></g>
  <text class="tw-who"   x="102" y="382" style="fill:var(--gen)">Luna</text>
  <text class="tw-model" x="52" y="417">openai/gpt-5.6-luna</text>

  <g transform="translate(72,476)" style="color:var(--ret)"><circle r="20" fill="var(--ret-soft)" stroke="var(--ret)" stroke-width="2.4"/><use href="#tw-g-sun"/></g>
  <text class="tw-who"   x="102" y="472" style="fill:var(--ret)">Sol</text>
  <text class="tw-model" x="52" y="507">openai/gpt-5.6-sol</text>

  <g transform="translate(72,559)" style="color:var(--line)"><circle r="20" fill="none" stroke="var(--line)" stroke-width="2.2" stroke-dasharray="5 5"/><use href="#tw-g-code"/></g>
  <text class="tw-who"   x="102" y="555" style="fill:var(--muted)" font-size="21">local code</text>
  <text class="tw-model" x="52" y="587">no model</text>

  <path class="tw-flow" d="M300 84 V112 H262 V386 H266"/>

  <!-- 1 Luna plans -->
  <rect class="tw-luna" x="272" y="350" width="176" height="72" rx="9"/>
  <text class="tw-step" x="284" y="370" style="fill:var(--gen)">1</text>
  <text class="tw-label" x="360" y="398" text-anchor="middle">Plans the answer</text>

  <path class="tw-flow" d="M448 386 H463 V476 H474"/>

  <!-- 2 Sol drafts -->
  <rect class="tw-sol" x="478" y="440" width="176" height="72" rx="9"/>
  <text class="tw-step" x="490" y="460" style="fill:var(--ret)">2</text>
  <text class="tw-label" x="566" y="488" text-anchor="middle">Writes the draft</text>

  <path class="tw-flow" d="M654 476 H669 V386 H680"/>

  <!-- 3 Luna audits -->
  <rect class="tw-luna" x="684" y="350" width="176" height="72" rx="9"/>
  <text class="tw-step" x="696" y="370" style="fill:var(--gen)">3</text>
  <text class="tw-label" x="772" y="392" text-anchor="middle">Audits each group</text>
  <text class="tw-sub"   x="772" y="412" text-anchor="middle">≤6 cards per group</text>

  <path class="tw-flow" d="M860 386 H875 V559 H886"/>

  <rect class="tw-loc" x="890" y="532" width="110" height="54" rx="9"/>
  <text class="tw-sub" x="945" y="553" text-anchor="middle">merges</text>
  <text class="tw-sub" x="945" y="573" text-anchor="middle">the cards</text>

  <path class="tw-flow" d="M1000 559 H1015 V476 H1026"/>

  <!-- 4 Sol proposes -->
  <rect class="tw-sol" x="1030" y="440" width="176" height="72" rx="9"/>
  <text class="tw-step" x="1042" y="460" style="fill:var(--ret)">4</text>
  <text class="tw-label" x="1118" y="488" text-anchor="middle">Proposes edits</text>

  <path class="tw-flow" d="M1206 476 H1221 V386 H1232"/>

  <!-- 5 Luna screens -->
  <rect class="tw-luna" x="1236" y="350" width="176" height="72" rx="9"/>
  <text class="tw-step" x="1248" y="370" style="fill:var(--gen)">5</text>
  <text class="tw-label" x="1324" y="392" text-anchor="middle">Screens each edit</text>
  <text class="tw-sub"   x="1324" y="412" text-anchor="middle">all five must pass</text>

  <path class="tw-flow" d="M1412 386 H1427 V559 H1438"/>

  <rect class="tw-loc" x="1442" y="532" width="110" height="54" rx="9"/>
  <text class="tw-sub" x="1497" y="553" text-anchor="middle">applies only</text>
  <text class="tw-sub" x="1497" y="573" text-anchor="middle">what passed</text>

  <path class="tw-flow" d="M1497 586 V614"/>

  <rect x="272" y="618" width="1280" height="58" rx="10" fill="var(--ok-soft)" stroke="var(--ok)" stroke-width="2.6"/>
  <text class="tw-label" x="912" y="644" text-anchor="middle">119 validated answers · one pass through the stages, not a repeating loop</text>
  <text class="tw-sub"   x="912" y="666" text-anchor="middle">if revision fails, the draft that already passed validation stands — the extra stages can only add</text>
</svg>
