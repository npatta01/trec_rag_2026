<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 700" role="img" aria-labelledby="tw-title tw-desc">
  <title id="tw-title">Single-pass and multi-stage generation from one sealed evidence set</title>
  <desc id="tw-desc">Both writers start from the same sealed evidence handoff and neither searches again. Single-pass: Sol drafts once, local code validates schema, citations and word limit, and one bounded retry is allowed before the answer is published. Multi-stage: Luna plans, Sol drafts, Luna audits the draft for omissions, Sol proposes edits, Luna screens each proposed edit for support, usefulness, repetition and lost qualifications, and local code applies only the accepted ones. A dashed fallback path keeps the already validated draft if revision fails. Solid arrows carry evidence or text; dashed arrows carry validation, retry and fallback control.</desc>
  <style>
    :root{color-scheme:light dark;--bg:#f6f8f7;--panel:#fff;--ink:#13231c;--muted:#4b5d54;--line:#5e6d66;--ret:#087c72;--ret-soft:#d9f1ed;--gen:#5664c7;--gen-soft:#e6e9ff;--ok:#277a45;--ok-soft:#ddf2e3;--adv:#91610d;--adv-soft:#faecc7}
    @media (prefers-color-scheme: dark){:root{--bg:#0d1411;--panel:#17211c;--ink:#f0f6f2;--muted:#bac7bf;--line:#9cada3;--ret:#69d8ca;--ret-soft:#183d38;--gen:#aab4ff;--gen-soft:#242b57;--ok:#82dda0;--ok-soft:#173c25;--adv:#f0c46f;--adv-soft:#433616}}
    text{fill:var(--ink);font-family:Inter,ui-sans-serif,system-ui,sans-serif}
    .title{font-size:36px;font-weight:720}
    .head{font-size:30px;font-weight:720}
    .label{font-size:25px;font-weight:650}
    .small{font-size:21px}
    .muted{fill:var(--muted)}
    .source{fill:var(--adv-soft);stroke:var(--adv);stroke-width:3}
    .ret{fill:var(--ret-soft);stroke:var(--ret);stroke-width:3}
    .gen{fill:var(--gen-soft);stroke:var(--gen);stroke-width:3}
    .ok{fill:var(--ok-soft);stroke:var(--ok);stroke-width:3}
    .flow{fill:none;stroke:var(--line);stroke-width:3;marker-end:url(#ar3)}
    .ctrl{fill:none;stroke:var(--adv);stroke-width:3;stroke-dasharray:8 6;marker-end:url(#ar3a)}
    .rule{stroke:var(--line);stroke-width:1.5;stroke-dasharray:4 6;opacity:.6}
  </style>
  <defs>
    <marker id="ar3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker>
    <marker id="ar3a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker>
  </defs>
  <rect width="1400" height="700" fill="var(--bg)"/>

  <rect class="source" x="230" y="46" width="940" height="86" rx="10"/>
  <text class="head" x="700" y="86" text-anchor="middle">One sealed evidence handoff</text>
  <text class="small muted" x="700" y="117" text-anchor="middle">exact passages · advisory nuggets · allowed citation IDs — neither writer searches again</text>

  <path class="flow" d="M700 132V156H350V180" vector-effect="non-scaling-stroke"/>
  <path class="flow" d="M700 132V156H1050V180" vector-effect="non-scaling-stroke"/>
  <line class="rule" x1="700" y1="175" x2="700" y2="660"/>

  <!-- Single-pass -->
  <text class="head" x="350" y="212" text-anchor="middle" fill="var(--ret)">Single-pass</text>
  <rect class="ret" x="110" y="238" width="480" height="78" rx="10"/>
  <text class="label" x="350" y="286" text-anchor="middle">Sol drafts the answer</text>
  <path class="flow" d="M350 316V356" vector-effect="non-scaling-stroke"/>
  <rect class="ret" x="110" y="360" width="480" height="98" rx="10"/>
  <text class="label" x="350" y="398" text-anchor="middle">Local validation</text>
  <text class="small muted" x="350" y="432" text-anchor="middle">schema · citations · word limit</text>
  <path class="ctrl" d="M610 409H650V287H610" vector-effect="non-scaling-stroke"/>
  <text class="small" x="664" y="352" fill="var(--adv)">one</text>
  <text class="small" x="664" y="378" fill="var(--adv)">retry</text>
  <path class="flow" d="M350 458V588" vector-effect="non-scaling-stroke"/>

  <!-- Multi-stage -->
  <text class="head" x="1050" y="212" text-anchor="middle" fill="var(--gen)">Multi-stage</text>
  <rect class="gen" x="790" y="238" width="520" height="58" rx="9"/>
  <text class="label" x="1050" y="275" text-anchor="middle">Luna plans the answer</text>
  <path class="flow" d="M1050 296V316" vector-effect="non-scaling-stroke"/>
  <rect class="gen" x="790" y="320" width="520" height="58" rx="9"/>
  <text class="label" x="1050" y="357" text-anchor="middle">Sol drafts</text>
  <path class="flow" d="M1050 378V398" vector-effect="non-scaling-stroke"/>
  <rect class="gen" x="790" y="402" width="520" height="58" rx="9"/>
  <text class="label" x="1050" y="439" text-anchor="middle">Luna audits for omissions</text>
  <path class="flow" d="M1050 460V480" vector-effect="non-scaling-stroke"/>
  <rect class="gen" x="790" y="484" width="520" height="58" rx="9"/>
  <text class="label" x="1050" y="521" text-anchor="middle">Sol proposes edits</text>
  <path class="flow" d="M1050 542V562" vector-effect="non-scaling-stroke"/>
  <rect class="gen" x="790" y="566" width="520" height="58" rx="9"/>
  <text class="label" x="1050" y="596" text-anchor="middle">Luna screens each edit</text>
  <text class="small muted" x="1050" y="618" text-anchor="middle">support · use · repetition · lost qualifications</text>

  <!-- fallback -->
  <path class="ctrl" d="M1330 595V349H1330" vector-effect="non-scaling-stroke"/>
  <text class="small" x="1352" y="472" fill="var(--adv)" transform="rotate(90 1352 472)">fallback</text>

  <path class="flow" d="M1050 624V652H700" vector-effect="non-scaling-stroke"/>
  <path class="flow" d="M350 588V652H700" vector-effect="non-scaling-stroke"/>
  <rect class="ok" x="520" y="656" width="360" height="42" rx="21"/>
  <text class="label" x="700" y="685" text-anchor="middle">119 validated answers each</text>
</svg>
