<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 620" role="img" aria-labelledby="ap-title ap-desc">
  <title id="ap-title">One request widens into a search, narrows to evidence, then splits into two submissions</title>
  <desc id="ap-desc">A funnel read left to right, where band height is proportional to how much material is in play. One narrative becomes at most twenty-five searches, each retrieving up to one thousand documents — the widest point. Reranking narrows each query to at most one hundred passages, and near-duplicate grouping narrows those to at most forty selected passages per subnarrative. The funnel then forks into two submissions built from that same evidence: a ranked retrieval run and a written answer with citations.</desc>
  <style>
    :root{color-scheme:light dark;--bg:#f6f8f7;--panel:#fff;--ink:#13231c;--muted:#4b5d54;--line:#5e6d66;--ret:#087c72;--ret-soft:#d9f1ed;--gen:#5664c7;--gen-soft:#e6e9ff;--ok:#277a45;--ok-soft:#ddf2e3;--adv:#91610d;--adv-soft:#faecc7}
    @media (prefers-color-scheme: dark){:root{--bg:#0d1411;--panel:#17211c;--ink:#f0f6f2;--muted:#bac7bf;--line:#9cada3;--ret:#69d8ca;--ret-soft:#183d38;--gen:#aab4ff;--gen-soft:#242b57;--ok:#82dda0;--ok-soft:#173c25;--adv:#f0c46f;--adv-soft:#433616}}
    text{fill:var(--ink);font-family:Inter,ui-sans-serif,system-ui,sans-serif}
    .ap-count{font-size:46px;font-weight:800;font-variant-numeric:tabular-nums}
    .ap-unit{font-size:27px;font-weight:600;fill:var(--muted)}
    .ap-edge{font-size:27px;font-weight:700;fill:var(--muted)}
    .ap-out{font-size:31px;font-weight:740}
    .ap-tick{font-size:24px;fill:var(--muted)}
    .ap-kick{font-size:25px;font-weight:800;letter-spacing:.06em;fill:var(--adv)}
    .ap-foot{font-size:23px;fill:var(--muted)}
  </style>
  <defs>
    <marker id="apar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker>
  </defs>
  <rect width="1600" height="620" fill="var(--bg)"/>

  <path d="M60 285 L280 255 L520 80 L780 150 L1000 210 L1150 245
           L1150 375 L1000 410 L780 470 L520 540 L280 365 L60 335 Z"
        fill="var(--ret-soft)" stroke="var(--ret)" stroke-width="3" stroke-linejoin="round"/>

  <g stroke="var(--ret)" stroke-width="2" opacity=".5">
    <line x1="280"  y1="255" x2="280"  y2="365"/>
    <line x1="520"  y1="80"  x2="520"  y2="540"/>
    <line x1="780"  y1="150" x2="780"  y2="470"/>
    <line x1="1000" y1="210" x2="1000" y2="410"/>
  </g>

  <text class="ap-edge" x="60" y="238">The request</text>
  <text class="ap-kick" x="30" y="46">THE SHAPE OF ONE REQUEST — THE SAME CONFIGURATION FOR ALL 119</text>
  <text class="ap-foot" x="30" y="596">configured ceilings, not measured yields · per query for documents and passages · per subnarrative for selected</text>

  <text class="ap-count" x="400"  y="302" text-anchor="middle">≤25</text>
  <text class="ap-unit"  x="400"  y="340" text-anchor="middle">searches</text>

  <text class="ap-count" x="650"  y="302" text-anchor="middle">≤1,000</text>
  <text class="ap-unit"  x="650"  y="340" text-anchor="middle">documents</text>

  <text class="ap-count" x="890"  y="302" text-anchor="middle">≤100</text>
  <text class="ap-unit"  x="890"  y="340" text-anchor="middle">passages</text>

  <text class="ap-count" x="1075" y="302" text-anchor="middle">≤40</text>
  <text class="ap-unit"  x="1075" y="340" text-anchor="middle">selected</text>

  <path d="M1156 290 H1200 V196 H1240" fill="none" stroke="var(--line)" stroke-width="3" marker-end="url(#apar)"/>
  <path d="M1156 330 H1200 V444 H1240" fill="none" stroke="var(--line)" stroke-width="3" marker-end="url(#apar)"/>

  <rect x="1244" y="152" width="326" height="88" rx="12" fill="var(--ret-soft)" stroke="var(--ret)" stroke-width="3"/>
  <text class="ap-out"  x="1407" y="190" text-anchor="middle">Retrieval run</text>
  <text class="ap-tick" x="1407" y="220" text-anchor="middle">ranked documents</text>

  <rect x="1244" y="400" width="326" height="88" rx="12" fill="var(--gen-soft)" stroke="var(--gen)" stroke-width="3"/>
  <text class="ap-out"  x="1407" y="438" text-anchor="middle">Written answer</text>
  <text class="ap-tick" x="1407" y="468" text-anchor="middle">with citations</text>

  <text class="ap-tick" x="1407" y="306" text-anchor="middle">same evidence,</text>
  <text class="ap-tick" x="1407" y="334" text-anchor="middle">two submissions</text>
</svg>
