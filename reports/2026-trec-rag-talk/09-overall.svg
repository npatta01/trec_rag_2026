<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" role="img" aria-labelledby="ov-title ov-desc">
  <title id="ov-title">All 42 scored topics, and both runs' assessor records</title>
  <desc id="ov-desc">Above, a grid of 42 squares, one per scored topic, grouped by outcome. Twenty-six squares are filled in the multi-stage colour: topics where multi-stage supported more nuggets. Fifteen are outlined in grey: topics where the two tied exactly. One is filled in the single-pass colour: the single topic where single-pass did better. Below, two bars showing each run's assessor record as a share of its own battles. Multi-stage won 62.9 per cent of its 399 battles; single-pass won 45.0 per cent of its 422. Each run is judged against other teams' answers, so the two bars are separate samples rather than a head-to-head.</desc>
  <style>
    :root{color-scheme:light dark;--bg:#f6f8f7;--panel:#fff;--ink:#13231c;--muted:#4b5d54;--line:#5e6d66;--ret:#087c72;--ret-soft:#d9f1ed;--gen:#5664c7;--gen-soft:#e6e9ff}
    @media (prefers-color-scheme: dark){:root{--bg:#0d1411;--panel:#17211c;--ink:#f0f6f2;--muted:#bac7bf;--line:#9cada3;--ret:#69d8ca;--ret-soft:#183d38;--gen:#aab4ff;--gen-soft:#242b57}}
    text{fill:var(--ink);font-family:Inter,ui-sans-serif,system-ui,sans-serif}
    .ov-kick{font-size:24px;font-weight:800;letter-spacing:.06em;fill:var(--muted)}
    .ov-n{font-size:46px;font-weight:800;font-variant-numeric:tabular-nums}
    .ov-lab{font-size:24px;font-weight:700}
    .ov-sub{font-size:24px;fill:var(--muted)}
    .ov-pct{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums}
  </style>
  <rect width="1600" height="560" fill="var(--bg)"/>

  <text class="ov-kick" x="40" y="36">ONE SQUARE PER SCORED TOPIC · 42 IN ALL</text>

  <g id="ov-cells">
    <rect x="40" y="62" width="30" height="30" rx="5" fill="var(--gen)" stroke="var(--gen)" stroke-width="2.6"/>
    <rect x="78" y="62" width="30" height="30" rx="5" fill="var(--gen)" stroke="var(--gen)" stroke-width="2.6"/>
