  <text class="ov-n"   x="40"  y="212" style="fill:var(--gen)">26</text>
  <text class="ov-lab" x="40"  y="242">multi-stage supported more</text>
  <text class="ov-n"   x="600" y="212" style="fill:var(--muted)">15</text>
  <text class="ov-lab" x="600" y="242">tied exactly</text>
  <text class="ov-n"   x="1000" y="212" style="fill:var(--ret)">1</text>
  <text class="ov-lab" x="1000" y="242">single-pass did better</text>

  <text class="ov-kick" x="40" y="314">ASSESSOR BATTLES WON — EACH RUN AGAINST THE FIELD, NOT AGAINST EACH OTHER</text>

  <rect x="40" y="340" width="1120" height="52" rx="26" fill="var(--gen-soft)"/>
  <rect x="40" y="340" width="705"  height="52" rx="26" fill="var(--gen)"/>
  <text class="ov-pct" x="1180" y="379" style="fill:var(--gen)">62.9%</text>
  <text class="ov-lab" x="64"  y="374" style="fill:var(--bg)">Multi-stage</text>
  <text class="ov-sub" x="1320" y="377">of 399 battles</text>

  <rect x="40" y="416" width="1120" height="52" rx="26" fill="var(--ret-soft)"/>
  <rect x="40" y="416" width="504"  height="52" rx="26" fill="var(--ret)"/>
  <text class="ov-pct" x="1180" y="455" style="fill:var(--ret)">45.0%</text>
  <text class="ov-lab" x="64"  y="450" style="fill:var(--bg)">Single-pass</text>
  <text class="ov-sub" x="1320" y="453">of 422 battles</text>

  <text class="ov-sub" x="40" y="520">The bar length is each run's own win rate. A longer bar is not a win over the other run — they never met.</text>
</svg>
