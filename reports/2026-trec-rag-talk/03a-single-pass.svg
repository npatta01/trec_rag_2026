<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 440" role="img" aria-labelledby="sp-title sp-desc">
  <title id="sp-title">Single-pass: one model call, then a validator</title>
  <desc id="sp-desc">A two-lane strip fed by one sealed evidence handoff. In the upper lane Sol, marked with a sun, writes the answer in one call. In the lower lane local code, marked with angle brackets and a dashed outline, validates it against three things: the output schema, that every citation names a document the topic may cite, and a limit of at most 1,024 words. A dashed arrow runs back from the validator to Sol for one retry, used on 2 of 119 requests. The result is 119 answers, one model call each. Sol is openai/gpt-5.6-sol.</desc>
  <style>
    :root{color-scheme:light dark;--bg:#f6f8f7;--panel:#fff;--ink:#13231c;--muted:#4b5d54;--line:#5e6d66;--ret:#087c72;--ret-soft:#d9f1ed;--ok:#277a45;--ok-soft:#ddf2e3;--adv:#91610d;--adv-soft:#faecc7}
    @media (prefers-color-scheme: dark){:root{--bg:#0d1411;--panel:#17211c;--ink:#f0f6f2;--muted:#bac7bf;--line:#9cada3;--ret:#69d8ca;--ret-soft:#183d38;--ok:#82dda0;--ok-soft:#173c25;--adv:#f0c46f;--adv-soft:#433616}}
    text{fill:var(--ink);font-family:Inter,ui-sans-serif,system-ui,sans-serif}
    .sp-head{font-size:30px;font-weight:760}
    .sp-who{font-size:30px;font-weight:780}
    .sp-label{font-size:27px;font-weight:700}
    .sp-sub{font-size:23px;fill:var(--muted)}
    .sp-chip{font-size:23px;font-weight:700;fill:var(--adv)}
    .sp-prov{font-size:20px;fill:var(--muted);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    .sp-flow{fill:none;stroke:var(--line);stroke-width:3;marker-end:url(#spa)}
    .sp-back{fill:none;stroke:var(--adv);stroke-width:3;stroke-dasharray:8 6;marker-end:url(#spb)}
    .sp-lane{fill:var(--panel);opacity:.45}
    .sp-ico{fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  </style>
  <defs>
    <marker id="spa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker>
    <marker id="spb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker>
    <g id="sp-g-sun" class="sp-ico"><circle cx="0" cy="0" r="4.8"/><path d="M0 -11.5V-8.4M0 8.4V11.5M-11.5 0H-8.4M8.4 0H11.5M-8.1 -8.1L-5.9 -5.9M5.9 5.9L8.1 8.1M8.1 -8.1L5.9 -5.9M-5.9 5.9L-8.1 8.1"/></g>
    <g id="sp-g-code" class="sp-ico"><path d="M-4 -8L-11 0L-4 8M4 -8L11 0L4 8"/></g>
    <g id="sp-g-tick" class="sp-ico"><path d="M-7 0L-2 5L7 -5"/></g>
  </defs>
  <rect width="1240" height="440" fill="var(--bg)"/>

  <rect x="260" y="8" width="950" height="58" rx="10" fill="var(--adv-soft)" stroke="var(--adv)" stroke-width="2.6"/>
  <text class="sp-head" x="735" y="47" text-anchor="middle">One sealed evidence handoff</text>

  <rect class="sp-lane" x="260" y="84" width="950" height="108" rx="10"/>
  <rect class="sp-lane" x="260" y="212" width="950" height="164" rx="10"/>

  <g transform="translate(70,138)" style="color:var(--ret)"><circle r="24" fill="var(--ret-soft)" stroke="var(--ret)" stroke-width="2.6"/><use href="#sp-g-sun"/></g>
  <text class="sp-who" x="104" y="148" style="fill:var(--ret)">Sol</text>

  <g transform="translate(70,288)" style="color:var(--line)"><circle r="24" fill="none" stroke="var(--line)" stroke-width="2.4" stroke-dasharray="5 5"/><use href="#sp-g-code"/></g>
  <text class="sp-who" x="104" y="296" style="fill:var(--muted)" font-size="24">local code</text>

  <path class="sp-flow" d="M420 66 V92"/>

  <rect x="300" y="96" width="320" height="84" rx="10" fill="var(--ret-soft)" stroke="var(--ret)" stroke-width="2.6"/>
  <text class="sp-label" x="460" y="147" text-anchor="middle">Writes the answer</text>

  <path class="sp-flow" d="M620 138 H650 V294 H676"/>

  <rect x="680" y="226" width="520" height="136" rx="10" fill="none" stroke="var(--line)" stroke-width="2.4" stroke-dasharray="5 5"/>
  <text class="sp-label" x="704" y="266">Validates it</text>
  <g style="color:var(--ok)">
    <g transform="translate(722,292)"><use href="#sp-g-tick"/></g>
    <g transform="translate(722,324)"><use href="#sp-g-tick"/></g>
    <g transform="translate(722,352)"><use href="#sp-g-tick"/></g>
  </g>
  <text class="sp-sub" x="746" y="299">the output schema</text>
  <text class="sp-sub" x="746" y="331">every citation is allowed</text>
  <text class="sp-sub" x="746" y="359">at most 1,024 words</text>

  <path class="sp-back" d="M700 226 V160 H626"/>
  <text class="sp-chip" x="714" y="167">one retry — used on 2 of 119</text>

  <rect x="260" y="392" width="950" height="42" rx="10" fill="var(--ok-soft)" stroke="var(--ok)" stroke-width="2.6"/>
  <text class="sp-label" x="735" y="421" text-anchor="middle" style="fill:var(--ok)">119 answers · one model call each</text>

  <text class="sp-prov" x="30" y="415">openai/gpt-5.6-sol</text>
</svg>
