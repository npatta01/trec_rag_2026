<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 690" role="img" aria-labelledby="da-title da-desc">
  <title id="da-title">How often the automated rubric and the human assessors rank the two runs differently</title>
  <desc id="da-desc">Across the 42 scored topics, the two measures agree on 20, all 20 of them favouring multi-stage; they disagree on 5; and on the remaining 17 one of the two measures is exactly tied, so there is nothing to disagree about. The five disagreements are listed, each with the run the automated rubric puts ahead and the run the human assessors put ahead. On rag2026-13 the rubric favours single-pass, 1.000 against 0.857, while the assessors favour multi-stage, 67 per cent of its battles against 50. On rag2026-59 the rubric favours multi-stage, 1.000 against 0.800, while the assessors favour single-pass, 67 against 58. On rag2026-97 the rubric favours multi-stage, 1.000 against 0.714, the assessors single-pass, 55 against 50. On rag2026-2 the rubric favours multi-stage, 0.833 against 0.667, the assessors single-pass, 40 against 38. On rag2026-109 the rubric favours multi-stage, 0.667 against 0.611, while the assessors favour single-pass by the widest margin on the list, 69 per cent against 29. Four of the five disagreements run the same way, with the rubric ahead on multi-stage and the assessors ahead on single-pass.</desc>
  <style>
    :root{color-scheme:light dark;--bg:#f6f8f7;--panel:#fff;--ink:#13231c;--muted:#4b5d54;--line:#5e6d66;--ret:#087c72;--ret-soft:#d9f1ed;--gen:#5664c7;--gen-soft:#e6e9ff;--ok:#277a45;--ok-soft:#ddf2e3;--adv:#91610d;--adv-soft:#faecc7}
    @media (prefers-color-scheme: dark){:root{--bg:#0d1411;--panel:#17211c;--ink:#f0f6f2;--muted:#bac7bf;--line:#9cada3;--ret:#69d8ca;--ret-soft:#183d38;--gen:#aab4ff;--gen-soft:#242b57;--ok:#82dda0;--ok-soft:#173c25;--adv:#f0c46f;--adv-soft:#433616}}
    text{fill:var(--ink);font-family:Inter,ui-sans-serif,system-ui,sans-serif}
    .da-kick{font-size:23px;font-weight:800;letter-spacing:.06em;fill:var(--muted)}
    .da-big{font-size:38px;font-weight:800}
    .da-cap{font-size:23px;fill:var(--muted)}
    .da-col{font-size:23px;font-weight:800;letter-spacing:.07em;fill:var(--muted)}
    .da-top{font-size:23px;font-weight:720;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    .da-run{font-size:23px;font-weight:760}
    .da-sc{font-size:23px}
  </style>
  <rect width="1500" height="560" fill="var(--bg)"/>

  <!-- the three outcomes, to scale against each other -->
  <rect x="40" y="34" width="420" height="104" rx="12" fill="var(--panel)" stroke="var(--ok)" stroke-width="3"/>
  <text class="da-big" x="64" y="88" style="fill:var(--ok)">20</text>
  <text class="da-cap" x="130" y="76">agree — and all 20</text>
  <text class="da-cap" x="130" y="100">favour multi-stage</text>
  <text class="da-kick" x="64" y="124">OF 42 SCORED TOPICS</text>

  <rect x="476" y="34" width="420" height="104" rx="12" fill="var(--adv-soft)" stroke="var(--adv)" stroke-width="3"/>
  <text class="da-big" x="500" y="88" style="fill:var(--adv)">5</text>
  <text class="da-cap" x="552" y="76">disagree — the two</text>
  <text class="da-cap" x="552" y="100">measures point apart</text>
  <text class="da-kick" x="500" y="124">LISTED BELOW</text>

  <rect x="912" y="34" width="548" height="104" rx="12" fill="var(--panel)" stroke="var(--line)" stroke-width="2"/>
  <text class="da-big" x="936" y="88">17</text>
  <text class="da-cap" x="1000" y="76">one measure is exactly tied,</text>
  <text class="da-cap" x="1000" y="100">so there is nothing to disagree about</text>

  <!-- column heads -->
  <text class="da-col" x="64"  y="188">TOPIC</text>
  <text class="da-col" x="300" y="188">AUTOMATED RUBRIC PUTS AHEAD</text>
  <text class="da-col" x="880" y="188">HUMAN ASSESSORS PUT AHEAD</text>
  <line x1="40" y1="202" x2="1460" y2="202" stroke="var(--line)" stroke-width="1.5" opacity=".5"/>

  <!-- rag2026-13 : rubric single-pass, assessors multi-stage -->
  <text class="da-top" x="64" y="262">rag2026-13</text>
  <rect x="300" y="238" width="300" height="36" rx="18" fill="var(--ret-soft)" stroke="var(--ret)" stroke-width="2.4"/>
  <text class="da-run" x="320" y="263" style="fill:var(--ret)">single-pass</text>
  <text class="da-sc"  x="452" y="263">1.000 v 0.857</text>
  <rect x="880" y="238" width="300" height="36" rx="18" fill="var(--gen-soft)" stroke="var(--gen)" stroke-width="2.4"/>
  <text class="da-run" x="900" y="263" style="fill:var(--gen)">multi-stage</text>
  <text class="da-sc"  x="1036" y="263">67% v 50%</text>

  <!-- rag2026-59 -->
  <text class="da-top" x="64" y="346">rag2026-59</text>
  <rect x="300" y="322" width="300" height="36" rx="18" fill="var(--gen-soft)" stroke="var(--gen)" stroke-width="2.4"/>
  <text class="da-run" x="320" y="347" style="fill:var(--gen)">multi-stage</text>
  <text class="da-sc"  x="456" y="347">1.000 v 0.800</text>
  <rect x="880" y="322" width="300" height="36" rx="18" fill="var(--ret-soft)" stroke="var(--ret)" stroke-width="2.4"/>
  <text class="da-run" x="900" y="347" style="fill:var(--ret)">single-pass</text>
  <text class="da-sc"  x="1032" y="347">67% v 58%</text>

  <!-- rag2026-97 -->
  <text class="da-top" x="64" y="430">rag2026-97</text>
  <rect x="300" y="406" width="300" height="36" rx="18" fill="var(--gen-soft)" stroke="var(--gen)" stroke-width="2.4"/>
  <text class="da-run" x="320" y="431" style="fill:var(--gen)">multi-stage</text>
  <text class="da-sc"  x="456" y="431">1.000 v 0.714</text>
  <rect x="880" y="406" width="300" height="36" rx="18" fill="var(--ret-soft)" stroke="var(--ret)" stroke-width="2.4"/>
  <text class="da-run" x="900" y="431" style="fill:var(--ret)">single-pass</text>
  <text class="da-sc"  x="1032" y="431">55% v 50%</text>

  <!-- rag2026-2 -->
  <text class="da-top" x="64" y="514">rag2026-2</text>
  <rect x="300" y="490" width="300" height="36" rx="18" fill="var(--gen-soft)" stroke="var(--gen)" stroke-width="2.4"/>
  <text class="da-run" x="320" y="515" style="fill:var(--gen)">multi-stage</text>
  <text class="da-sc"  x="456" y="515">0.833 v 0.667</text>
  <rect x="880" y="490" width="300" height="36" rx="18" fill="var(--ret-soft)" stroke="var(--ret)" stroke-width="2.4"/>
  <text class="da-run" x="900" y="515" style="fill:var(--ret)">single-pass</text>
  <text class="da-sc"  x="1032" y="515">40% v 38%</text>

  <!-- rag2026-109 : the widest gap on the list -->
  <text class="da-top" x="64" y="598">rag2026-109</text>
  <rect x="300" y="574" width="300" height="36" rx="18" fill="var(--gen-soft)" stroke="var(--gen)" stroke-width="2.4"/>
  <text class="da-run" x="320" y="599" style="fill:var(--gen)">multi-stage</text>
  <text class="da-sc"  x="456" y="599">0.667 v 0.611</text>
  <rect x="880" y="574" width="300" height="36" rx="18" fill="var(--ret-soft)" stroke="var(--ret)" stroke-width="3.4"/>
  <text class="da-run" x="900" y="599" style="fill:var(--ret)">single-pass</text>
  <text class="da-sc"  x="1032" y="599">69% v 29%</text>
  <text class="da-cap" x="1200" y="599">— the widest gap here</text>

  <text class="da-cap" x="64" y="660">Four of the five run the same way: the rubric ahead on multi-stage, the assessors ahead on single-pass.</text>
</svg>
