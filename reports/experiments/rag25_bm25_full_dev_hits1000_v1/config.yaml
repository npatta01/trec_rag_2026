# Exact runtime config used for the recorded run.
# The runtime id predates the canonical experiment folder id and is preserved
# because the large local cache/output artifacts were written under this id.
experiment:
  id: cache_demo_two_topics_hits1000
  output_dir: tmp/hits1000-full-dev/output

submission:
  team_id: local-baseline

topics:
  path: trec-rag-data/trec-rag-2026/development-data/topics/rag25-topics-dev.tsv
  format: tsv

query_understanding:
  variants:
    - name: original
      type: original_topic

retrievers:
  - name: climbmix_bm25
    type: pyserini_remote
    query_variants: [original]
    hits: 1000
    index: climbmix-400b
    cache: true

ranking:
  type: passthrough
  dedupe:
    by: docid
    keep: best_rank
    preserve_provenance: true

evidence:
  type: top_k
  k: 5
  require_text: true
  allow_fewer: true

generation:
  type: placeholder

evaluation:
  kind: dev_projected_qrels
  qrels: trec-rag-data/trec-rag-2026/development-data/rag25-dev-umbrela-qrels/rag25-climbmix-umbrela-codex-gpt5.5-medium-reasoning-v1.qrels
  metrics: [ndcg@10, recall@100]
  relevance_threshold: 2
