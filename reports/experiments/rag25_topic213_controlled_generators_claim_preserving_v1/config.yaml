experiment:
  id: rag25_topic213_controlled_generators_claim_preserving_v1
  run_id: topic213-controlled-generators-claim-preserving-v1
  team_id: issue19-controlled
  run_desc: Claim-preserving controlled comparison over one frozen 42-claim Topic 213 evidence ledger.
  output_dir: outputs/rag25_topic213_controlled_generators_claim_preserving_v1
  report_dir: reports/experiments/rag25_topic213_controlled_generators_claim_preserving_v1

inputs:
  source_generation: outputs/rag25_topic213_full_documents_qwen_local_v1/response_generation.json
  source_support_audit: outputs/rag25_topic213_full_documents_qwen_local_v1/claim_support_audit.jsonl
  nuggets: trec-rag-data/trec-rag-2026/development-data/rag25-dev-nuggets/rag25-dev-nuggets.jsonl
  original_baseline_metrics: reports/experiments/rag25_topic213_full_documents_qwen_local_v1/metrics.json
  compliant_baseline_metrics: reports/experiments/rag25_topic213_full_documents_trec26_qwen_local_v1/metrics.json

shared_generation:
  expected_supported_claim_count: 42
  expected_source_word_count: 969
  sentence_quotas: [5, 5, 4, 4, 5, 5, 3, 2, 5, 4]
  facet_word_targets: [85, 130, 90, 95, 95, 130, 80, 45, 120, 90]
  minimum_words: 900
  maximum_words: 1000
  temperature: 0.0
  max_tokens: 3500

models:
  - key: qwen_local
    display_name: Local Qwen3-4B
    provider: local LiteLLM/vLLM
    api_base_env: LITELLM_BASE_URL
    api_base: http://localhost:4000/v1
    api_key_env: LITELLM_API_KEY
    api_key: none
    model: qwen-local
    model_identity: Qwen/Qwen3-4B-Instruct-2507
    timeout_seconds: 360
    transport_max_attempts: 3
    request_overrides: {}
  - key: deepseek_v4_flash
    display_name: DeepSeek V4 Flash
    provider: OpenRouter/Baidu
    api_base: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    model: deepseek/deepseek-v4-flash
    model_identity: deepseek/deepseek-v4-flash
    timeout_seconds: 360
    transport_max_attempts: 3
    request_overrides:
      reasoning:
        enabled: false
      provider:
        order: [Baidu]
        allow_fallbacks: false
  - key: gpt_5_6_sol
    display_name: GPT-5.6 Sol
    provider: OpenRouter/OpenAI
    api_base: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    model: openai/gpt-5.6-sol
    model_identity: openai/gpt-5.6-sol
    timeout_seconds: 360
    transport_max_attempts: 3
    request_overrides: {}

audit:
  api_base_env: LITELLM_BASE_URL
  api_base: http://localhost:4000/v1
  api_key_env: LITELLM_API_KEY
  api_key: none
  model: qwen-local
  model_identity: Qwen/Qwen3-4B-Instruct-2507
  temperature: 0.0
  max_tokens: 350
  timeout_seconds: 240
  http_max_attempts: 4
  validation_attempts: 3

evaluation:
  expected_nugget_count: 50
  temperature: 0.0
  max_tokens: 1400
  validation_attempts: 3
