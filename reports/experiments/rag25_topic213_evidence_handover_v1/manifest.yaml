limitations:
  - The ranking logits are not calibrated probabilities.
  - Only ranks 1 through 12 were reviewed; lower-ranked documents remain unknown.
  - Five documents per sub-narrative are a concise handover, not an exhaustive bibliography.
  - A document may appear in multiple sub-narratives when it supports distinct claims.
  - Source quality varies, so final claims are intentionally narrower than some source interpretations.
  - The armistice stopped open hostilities but did not create a peace treaty.
  - Passage selection is automated evidence triage, not a claim-level adjudication or synthesized answer.
  - Two document calls failed provider-side schema validation and were not retried, leaving those documents absent from passages.jsonl.
  - Five oversized mixed-topic documents used deterministic Korean-War segment filtering before their single model call.

notes: >-
  Ten exact released labels; 12 candidates reviewed per label; five
  support-score-2-or-3 documents retained per label; 173 all-label passage
  extraction calls attempted; no full documents or passage locations tracked.
