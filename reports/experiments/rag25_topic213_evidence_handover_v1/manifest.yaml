scoring_definitions:
  eligibility: organizer Topic 213 qrel grade 2, 3, or 4
  ranking: strongest semantic-chunk raw logit retained for each whole-document pair
  organizer_qrel_grade: topic-level source provenance; not a sub-narrative score
  support_score_0: no support for the sub-narrative
  support_score_1: related but insufficient or indirect
  support_score_2: at least one useful concrete claim is supported
  support_score_3: direct and detailed support
