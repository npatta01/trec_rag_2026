passage_extraction:
  call_policy: exactly one model call attempted per eligible document; no retries
  labels_per_call: 10
  output_policy: unsupported label-document pairs omitted
  passage_limit_per_label_document_pair: 3
  verbatim_match_rule: exact Unicode substring of the JSON-decoded source text; no whitespace normalization
  fragment_merge_rule: adjacent selected fragments merged only across source whitespace, then exact-substring reverified
  oversized_document_rule: five documents over 80000 characters were bounded to source-exact Korean-War segments selected by deterministic keyword matching, with adjacent context and a 300-segment cap
  failed_document_ids:
    - shard_00001_10555
    - shard_00004_63642
  failed_response_reason: provider rejected unsupported strict-schema keywords before model inference; calls were not retried
  output_fields:
