type: task
name: rag26-retrieval-cache-shard

image: huggingface/trl@sha256:4de10fa68e4f4e060cb41885044208e2a44715fc0d52ce83bb071b1fc6d63db1
entrypoint: /bin/bash -c
shell: bash
working_dir: /dstack/run/trec_rag_2026

# This deliberately nonexistent path makes a bare `dstack apply -f` fail on the
# local machine. code/tools/apply_retrieval_cache_shard.sh replaces it in a
# private temporary copy with a clean committed-only snapshot immediately
# before invoking dstack.
repos:
  - local_path: /dev/null/trec-rag-dstack-transport-requires-launcher
    path: /dstack/run/trec_rag_2026
    if_exists: error

env:
  - HF_TOKEN=${{ secrets.hf_token }}
  - INDEX_URL=${{ secrets.INDEX_URL }}
  - PYSERINI_API_TOKEN=${{ secrets.PYSERINI_API_TOKEN }}
  - OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}
  - HF_CLI_MODE=direct

commands:
  - 'bash code/tools/run_retrieval_cache_shard.sh ${{ run.args }}'

resources:
  gpu:
    name: [A40, A6000, L40S]
    count: 1
    memory: 48GB..
  memory: 32GB..
  disk: 100GB

backends: [runpod, vastai]
spot_policy: on-demand
max_price: 1.0
max_duration: 5h
idle_duration: 0s
retry:
  on_events: [no-capacity]
  duration: 30m
