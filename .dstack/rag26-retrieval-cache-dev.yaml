type: dev-environment
name: rag26-retrieval-cache-dev

image: huggingface/trl@sha256:4de10fa68e4f4e060cb41885044208e2a44715fc0d52ce83bb071b1fc6d63db1
ide: vscode
working_dir: /workflow

env:
  - HF_TOKEN=${{ secrets.hf_token }}
  - INDEX_URL=${{ secrets.INDEX_URL }}
  - PYSERINI_API_TOKEN=${{ secrets.PYSERINI_API_TOKEN }}
  - OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}
  - HF_CLI_MODE=direct

resources:
  gpu:
    name: [A40, A6000, L40S]
    count: 1
    memory: 48GB..
  memory: 32GB..
  disk: 100GB

backends: [runpod, vastai]
spot_policy: on-demand
max_price: 1.0
max_duration: 5h
idle_duration: 30m
