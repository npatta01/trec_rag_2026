type: task
name: rag26-agentic-retrieval-worker

# Digest-pinned runtime; apply_agentic_retrieval_worker.sh replaces the
# sentinel repository path with a clean committed-only snapshot and adds the
# private plan/config files in its temporary transport directory.
image: huggingface/trl@sha256:4de10fa68e4f4e060cb41885044208e2a44715fc0d52ce83bb071b1fc6d63db1
entrypoint: /bin/bash -c
shell: bash
working_dir: /dstack/run/trec_rag_2026
repos:
  - local_path: /dev/null/trec-rag-dstack-agentic-transport-requires-launcher
    path: /dstack/run/trec_rag_2026
    if_exists: error

env:
  - INDEX_URL=${{ secrets.INDEX_URL }}
  - PYSERINI_API_TOKEN=${{ secrets.PYSERINI_API_TOKEN }}
  - OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}
  - HF_TOKEN=${{ secrets.hf_token }}
  - HF_CLI_MODE=direct

commands:
  - 'bash code/tools/run_agentic_retrieval_worker.sh ${{ run.args }}'

resources:
  gpu:
    name: [A40, A6000, L40S]
    count: 1
    memory: 48GB..
  memory: 48GB..
  disk: 100GB

backends: [runpod, vastai]
spot_policy: on-demand
max_price: 1.0
max_duration: 6h
idle_duration: 0s
retry:
  on_events: [no-capacity]
  duration: 30m
