type: task
name: rag26-retrieval-baseline-worker

image: huggingface/trl@sha256:4de10fa68e4f4e060cb41885044208e2a44715fc0d52ce83bb071b1fc6d63db1
entrypoint: /bin/bash -c
shell: bash
working_dir: /dstack/run/trec_rag_2026
repos:
  - local_path: /dev/null/trec-rag-dstack-baseline-transport-requires-snapshot
    path: /dstack/run/trec_rag_2026
    if_exists: error

env:
  - HF_TOKEN=${{ secrets.hf_token }}
  - HF_CLI_MODE=direct

commands:
  - 'bash code/tools/run_retrieval_baseline_worker.sh ${{ run.args }}'

resources:
