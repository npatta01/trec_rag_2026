[project]
name = "trec-rag-workspace"
version = "0.1.0"
requires-python = ">=3.11,<4.0"
dependencies = [
    "arize-phoenix-otel==0.16.1",
    "deepagents==0.7.0",
    "filelock==3.20.3",
    "langchain-openrouter==0.2.7",
    "PyYAML",
    "requests==2.32.5",
    "requests-ratelimiter==0.7.0",
    "semantic-text-splitter",
    "nuggetizer==0.0.5",
    "openinference-instrumentation-langchain==0.1.67",
    "openinference-semantic-conventions==0.1.30",
    "ragdoll",
]

[tool.uv.sources]
# The pinned `ragdoll/` submodule is a real dependency of the post-run evaluation
# workflow, not something callers should have to put on PYTHONPATH. Editable so the
# commit the superproject has checked out is the one that runs.
ragdoll = { path = "ragdoll", editable = true }

[dependency-groups]
dev = [
    "arize-phoenix-client==2.13.0",
    "pytest",
]
observability = [
    "arize-phoenix-client",
    "arize-phoenix-otel>=0.16.0",
]
rocm = [
    "numpy ; python_version == '3.12' and sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sentence-transformers ; python_version == '3.12' and sys_platform == 'linux' and platform_machine == 'x86_64'",
    "torch @ https://repo.radeon.com/rocm/manylinux/rocm-rel-7.2.1/torch-2.9.1%2Brocm7.2.1.lw.gitff65f5bc-cp312-cp312-linux_x86_64.whl ; python_version == '3.12' and sys_platform == 'linux' and platform_machine == 'x86_64'",
    "transformers>=4.55.5 ; python_version == '3.12' and sys_platform == 'linux' and platform_machine == 'x86_64'",
    "triton @ https://repo.radeon.com/rocm/manylinux/rocm-rel-7.2.1/triton-3.5.1%2Brocm7.2.1.gita272dfa8-cp312-cp312-linux_x86_64.whl ; python_version == '3.12' and sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.dependency-groups]
rocm = { requires-python = ">=3.12,<3.13" }

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "code"

[tool.setuptools.packages.find]
where = ["code"]

[tool.pytest.ini_options]
pythonpath = ["code"]
testpaths = ["code/tests"]
